    if (opts.limit) lista = lista.slice(0, opts.limit);
    const docs = lista.map(l => ({ id: l.id, exists: true, data: () => clonar(l.dados), metadata: { fromCache: false, hasPendingWrites: false } }));
    return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
  }

  /* ---------- assinaturas: carga inicial, tempo real e conferência periódica ---------- */
  const ouvintes = new Map();     // coleção -> Set de ouvintes
  const ultimaLeitura = new Map(); // coleção -> { linhas, texto }
  const agendadas = new Map();
  let canal = null;
  let tempoRealOk = false;
  let relogio = null;

  async function recarregar(col) {
    const lista = ouvintes.get(col);
    if (!lista || !lista.size) return;
    let linhas;
    try { linhas = await lerColecao(col); }
    catch (e) {
      for (const o of lista) if (!o.recebeu && o.ativo) { o.ativo = false; lista.delete(o); try { o.err(e); } catch (x) { /* ouvinte encerrado */ } }
      return;   // quem já tem dados fica com os últimos; a próxima conferência tenta de novo
    }
    const texto = JSON.stringify(linhas);
    ultimaLeitura.set(col, { linhas, texto });
    for (const o of lista) entregar(o, linhas, texto);
  }
  function entregar(o, linhas, texto) {
    if (!o.ativo) return;
    if (o.recebeu && o.texto === texto) return;   // nada mudou: não força o mapa a redesenhar
    o.recebeu = true; o.texto = texto;
    try { o.next(montarSnapshot(linhas, o.opts)); } catch (e) { console.error(e); }
  }
  function agendarRecarga(col, espera = 250) {
    clearTimeout(agendadas.get(col));
    agendadas.set(col, setTimeout(() => { agendadas.delete(col); recarregar(col); }, espera));
  }
  function recarregarTodas() { for (const col of ouvintes.keys()) agendarRecarga(col, 50); }
  function ligarRelogio() {
    clearInterval(relogio);
    relogio = setInterval(recarregarTodas, tempoRealOk ? CONSULTA_COM_TEMPO_REAL : CONSULTA_SEM_TEMPO_REAL);
  }
  function ligarTempoReal() {
    if (canal) return;
    canal = sb.channel('mapa-documentos')
      .on('postgres_changes', { event: '*', schema: 'public', table: TABELA }, payload => {
        const reg = (payload && (payload.new && payload.new.colecao ? payload.new : payload.old)) || {};
        if (reg.colecao) agendarRecarga(reg.colecao); else recarregarTodas();
      })
      .subscribe(status => {
        const ok = status === 'SUBSCRIBED';
        if (ok !== tempoRealOk) { tempoRealOk = ok; ligarRelogio(); }
        if (ok) recarregarTodas();   // cobre o que mudou enquanto a conexão estava fora
      });
    ligarRelogio();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') recarregarTodas(); });
    window.addEventListener('online', recarregarTodas);
  }
  function assinar(col, opts, next, err) {
    const o = { opts, next, err: err || (() => {}), ativo: true, recebeu: false, texto: null };
    if (!ouvintes.has(col)) ouvintes.set(col, new Set());
    ouvintes.get(col).add(o);
    ligarTempoReal();
    const ultima = ultimaLeitura.get(col);
    if (ultima) setTimeout(() => entregar(o, ultima.linhas, ultima.texto), 0);
    agendarRecarga(col, ultima ? 250 : 0);
    return () => { o.ativo = false; const l = ouvintes.get(col); if (l) l.delete(o); };
  }

  /* ---------- gravações ---------- */
  function exigirEdicao() { if (!podeGravar()) throw erro('invalid_argument', 'Esta conta não tem permissão de edição.'); }
  function refDoc(col, id) {
    id = String(id);
    return Object.freeze({
      id, path: col + '/' + id,
      async get() {
        const r = await sb.from(TABELA).select('dados').eq('colecao', col).eq('id', id).limit(1);
        if (r.error) throw traduzirErro(r.error, r.status);
        const l = (r.data || [])[0];
        return { id, exists: !!l, data: () => (l ? clonar(l.dados) : undefined), metadata: {} };
      },
      async set(dados) {
        exigirEdicao();
        if (!dados || typeof dados !== 'object' || Array.isArray(dados)) throw erro('invalid_argument', 'Documento inválido.');
        const r = await sb.from(TABELA).upsert({ colecao: col, id, dados }, { onConflict: 'colecao,id' });
        if (r.error) throw traduzirErro(r.error, r.status);
        agendarRecarga(col);
      },
      async update(parcial) {
        const atual = await this.get();
        if (!atual.exists) throw erro('invalid_argument', 'Documento não encontrado.');
        return this.set(Object.assign(atual.data(), parcial));
      },
      async delete() {
        exigirEdicao();
        const r = await sb.from(TABELA).delete().eq('colecao', col).eq('id', id);
        if (r.error) throw traduzirErro(r.error, r.status);
        agendarRecarga(col);
      }
    });
  }
  function consulta(col, opts) {
    return Object.freeze({
      path: col,
      orderBy: (campo, dir = 'asc') => consulta(col, Object.assign({}, opts, { orderBy: [campo, dir] })),
      limit: n => consulta(col, Object.assign({}, opts, { limit: n })),
      async get() { return montarSnapshot(await lerColecao(col), opts); },
      onSnapshot: (next, err) => assinar(col, opts, next, err),
      doc: id => refDoc(col, id)
    });
  }
  const db = Object.freeze({ collection: col => consulta(String(col), {}) });

  /* ---------- quem está vendo ---------- */
  const usuario = Object.freeze({
    canEdit: async () => podeGravar(),
    isOwner: async () => papel === 'dono',
    can: async nome => (nome === 'data.write' ? podeGravar() : null),
    id: async () => (sessao ? sessao.user.id : null),
    me: async () => ({ id: sessao ? sessao.user.id : null, name: sessao ? sessao.user.email || '' : '' }),
    profiles: async () => ({})
  });

  /* ---------- arquivos: download comum do navegador ---------- */
  const TIPOS = { pdf: 'application/pdf', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', json: 'application/json', csv: 'text/csv', txt: 'text/plain' };
  const downloads = Object.freeze({
    async save({ filename, data } = {}) {
      if (typeof filename !== 'string' || !filename || data === undefined || data === null) throw erro('bad_request', 'Arquivo inválido.');
      const ext = (filename.split('.').pop() || '').toLowerCase();
      const blob = data instanceof Blob ? data : new Blob([data], { type: TIPOS[ext] || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.rel = 'noopener'; a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return { status: 'saved' };
    }
  });

  window.claude = Object.freeze({
    use(nome) {
      if (nome === 'db') return acessoPronto.then(() => db);
      if (nome === 'user') return acessoPronto.then(() => usuario);
      if (nome === 'downloads') return Promise.resolve(downloads);
      return Promise.resolve(null);
    }
  });

  /* =========================================================================
     Tela de entrada (usa os mesmos estilos de botões e campos do mapa)
     ========================================================================= */
  let tela = null;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function estilo() {

    const st = document.createElement('style');
    st.id = 'mapa-acesso-estilo';
    st.textContent = `
      #mapa-acesso { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow-y: auto;
        padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
        background: var(--bg, #F7F5F4); color: var(--text, #2B2321); font-family: var(--font, "Ubuntu", system-ui, sans-serif); transition: opacity .25s ease; }
      #mapa-acesso.saindo { opacity: 0; pointer-events: none; }

      #mapa-acesso .acesso-cartao { width: 100%; max-width: 400px; box-sizing: border-box; background: var(--surface, #fff); border: 1px solid var(--border, #E8E2DF);
        border-radius: var(--radius, 12px); box-shadow: var(--shadow-pop, 0 8px 28px rgba(43,35,33,.16)); padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 14px; }
      #mapa-acesso .acesso-marca { display: flex; align-items: center; gap: 14px; }

      #mapa-acesso h1 { margin: 0; font-size: var(--fs-xl, 20px); line-height: 1.2; color: var(--title, #7D0003); text-wrap: balance; }
      #mapa-acesso .acesso-sub { margin: 2px 0 0; font-size: var(--fs-sm, 12.5px); color: var(--text-2, #6E6360); }
      #mapa-acesso .acesso-corpo { display: flex; flex-direction: column; gap: 12px; }
      #mapa-acesso form { display: flex; flex-direction: column; gap: 12px; margin: 0; }
      #mapa-acesso .inp { min-height: 44px; box-sizing: border-box; width: 100%; }
      #mapa-acesso .btn { min-height: 44px; justify-content: center; width: 100%; }
      #mapa-acesso .acesso-texto { margin: 0; font-size: var(--fs-md, 14px); line-height: 1.5; color: var(--text-2, #6E6360); }
      #mapa-acesso .acesso-texto b { color: var(--text, #2B2321); }

      #mapa-acesso .acesso-msg.erro { background: var(--bad-bg, #FBE6E7); color: var(--bad-ink, #A31F25); }
      #mapa-acesso .acesso-msg.ok { background: var(--ok-bg, #E6F4EC); color: var(--ok-ink, #157A45); }
      #mapa-acesso .acesso-link { align-self: center; background: none; border: 0; padding: 10px 8px; min-height: 44px; font: inherit; font-size: var(--fs-sm, 12.5px);
        color: var(--simao-ink, #C82000); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
      #mapa-acesso .acesso-rodape { margin: 4px 0 0; font-size: var(--fs-xs, 11.5px); color: var(--muted, #9A918E); text-align: center; }
      #mapa-acesso .acesso-carregando { display: flex; align-items: center; gap: 10px; color: var(--text-2, #6E6360); font-size: var(--fs-md, 14px); padding: 8px 0; }
      #mapa-acesso .acesso-carregando i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border, #E8E2DF); border-top-color: var(--simao, #FF2A00); animation: mapa-gira 0.9s linear infinite; }
      @keyframes mapa-gira { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #mapa-acesso .acesso-carregando i { animation: none; } }
      .rodape-lateral .mapa-conta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
      .rodape-lateral .mapa-conta .quem { width: 100%; overflow-wrap: anywhere; }
      .rodape-lateral .mapa-conta button { background: none; border: 0; padding: 6px 0; min-height: 32px; font: inherit; color: var(--simao-ink, #C82000);
        cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
      @media (max-width: 768px) { .rodape-lateral .mapa-conta button { min-height: 44px; } }
    `;
    document.head.appendChild(st);
  }

  function montarTela() {
    if (tela) return;
    estilo();
    tela = document.createElement('div');
    tela.id = 'mapa-acesso';
    tela.setAttribute('role', 'dialog');
    tela.setAttribute('aria-modal', 'true');
    tela.setAttribute('aria-labelledby', 'acesso-titulo');
    tela.innerHTML = `<div class="acesso-cartao">
        <div class="acesso-marca">
          <img class="acesso-logo" src="${LOGO}" alt="Simão Distribuidora">
          <div><h1 id="acesso-titulo">Mapa de Produtividade</h1><p class="acesso-sub">Simão Distribuidora · CD Rio Branco/AC</p></div>
        </div>
        <div class="acesso-corpo" id="acesso-corpo" aria-live="polite"></div>
        <p class="acesso-rodape">Acesso restrito. Dados de uso interno da Simão Distribuidora.</p>
      </div>`;
    document.body.appendChild(tela);
    document.documentElement.style.overflow = 'hidden';
  }
  function corpo(html, focar) {
    montarTela();
    const c = document.getElementById('acesso-corpo');
    c.innerHTML = html;
    const alvo = focar && c.querySelector(focar);
    if (alvo) setTimeout(() => alvo.focus(), 30);
    return c;
  }
  const msg = (tipo, texto) => `<p class="acesso-msg ${tipo}" role="${tipo === 'erro' ? 'alert' : 'status'}">${texto}</p>`;
  function carregando(texto) { corpo(`<div class="acesso-carregando"><i aria-hidden="true"></i><span>${esc(texto)}</span></div>`); }
  function ocupar(form, sim, rotulo) {
    form.querySelectorAll('input, button').forEach(el => { el.disabled = sim; });
    const b = form.querySelector('button[type="submit"]');
    if (b && rotulo) { if (sim) { b.dataset.rotulo = b.textContent; b.textContent = rotulo; } else if (b.dataset.rotulo) b.textContent = b.dataset.rotulo; }
  }

  function telaEntrar(aviso) {
    const c = corpo(`
      ${aviso || ''}
      <form id="form-entrar" novalidate>
        <div class="campo"><label for="acesso-email">E-mail</label><input class="inp" id="acesso-email" type="email" autocomplete="username" inputmode="email" required></div>
        <div class="campo"><label for="acesso-senha">Senha</label><input class="inp" id="acesso-senha" type="password" autocomplete="current-password" required></div>
        <div id="acesso-erro"></div>
        <button class="btn primario" type="submit">Entrar</button>
      </form>
      <button type="button" class="acesso-link" id="acesso-esqueci">Esqueci minha senha</button>`, '#acesso-email');
    const form = c.querySelector('#form-entrar');
    form.addEventListener('submit', async ev => {
      ev.preventDefault();
      const email = form.querySelector('#acesso-email').value.trim();
      const senha = form.querySelector('#acesso-senha').value;
      const caixaErro = form.querySelector('#acesso-erro');
      if (!email || !senha) { caixaErro.innerHTML = msg('erro', 'Preencha o e-mail e a senha.'); return; }
      ocupar(form, true, 'Entrando…');
      const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
      if (error) {
        ocupar(form, false);
        caixaErro.innerHTML = msg('erro', textoErroLogin(error));
        form.querySelector('#acesso-senha').select();
        return;
      }
      sessao = data.session;
      verificarAcesso();
    });
    c.querySelector('#acesso-esqueci').addEventListener('click', () => telaEsqueci(c.querySelector('#acesso-email').value.trim()));
  }
  function textoErroLogin(e) {
    const t = `${e.code || ''} ${e.message || ''}`.toLowerCase();
    if (/invalid_credentials|invalid login/.test(t)) return 'E-mail ou senha incorretos.';
    if (/email_not_confirmed|not confirmed/.test(t)) return 'Este e-mail ainda não foi confirmado. Peça ao responsável para confirmar o seu acesso.';
    if (/rate|too many|over_request/.test(t) || e.status === 429) return 'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.';
    if (/fetch|network|load failed/.test(t) || !e.status) return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
    return 'Não foi possível entrar: ' + esc(e.message || 'erro desconhecido') + '.';
  }

  function telaEsqueci(emailInicial) {
    const c = corpo(`
      <p class="acesso-texto">Informe o e-mail cadastrado. Você vai receber um link para criar uma nova senha.</p>
      <form id="form-esqueci" novalidate>
        <div class="campo"><label for="acesso-email-rec">E-mail</label><input class="inp" id="acesso-email-rec" type="email" autocomplete="username" inputmode="email" value="${esc(emailInicial)}" required></div>
        <div id="acesso-erro"></div>
        <button class="btn primario" type="submit">Enviar link</button>
      </form>
      <button type="button" class="acesso-link" id="acesso-voltar">Voltar para a entrada</button>`, '#acesso-email-rec');
    const form = c.querySelector('#form-esqueci');
    form.addEventListener('submit', async ev => {
      ev.preventDefault();
      const email = form.querySelector('#acesso-email-rec').value.trim();
      if (!email) { form.querySelector('#acesso-erro').innerHTML = msg('erro', 'Informe o e-mail.'); return; }
      ocupar(form, true, 'Enviando…');
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      ocupar(form, false);
      if (error && (error.status === 429 || /rate/i.test(error.message || ''))) { form.querySelector('#acesso-erro').innerHTML = msg('erro', 'Muitos pedidos seguidos. Aguarde alguns minutos e tente de novo.'); return; }
      telaEntrar(msg('ok', 'Se o e-mail estiver cadastrado, o link chega em alguns minutos (confira também o spam). Se não chegar, peça ao responsável pelo Mapa para redefinir a sua senha.'));
    });
    c.querySelector('#acesso-voltar').addEventListener('click', () => telaEntrar());
  }

  function telaNovaSenha({ titulo, texto, aoSalvar, podeVoltar }) {
    const c = corpo(`
      <p class="acesso-texto"><b>${esc(titulo)}</b><br>${esc(texto)}</p>
      <form id="form-senha" novalidate>
        <div class="campo"><label for="acesso-nova">Nova senha</label><input class="inp" id="acesso-nova" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="campo"><label for="acesso-repete">Repita a nova senha</label><input class="inp" id="acesso-repete" type="password" autocomplete="new-password" minlength="8" required></div>
        <div id="acesso-erro"></div>
        <button class="btn primario" type="submit">Salvar senha</button>
      </form>
      ${podeVoltar ? '<button type="button" class="acesso-link" id="acesso-voltar">Cancelar</button>' : ''}`, '#acesso-nova');
    const form = c.querySelector('#form-senha');
    form.addEventListener('submit', async ev => {
      ev.preventDefault();
      const nova = form.querySelector('#acesso-nova').value, repete = form.querySelector('#acesso-repete').value;
      const caixaErro = form.querySelector('#acesso-erro');
      if (nova.length < 8) { caixaErro.innerHTML = msg('erro', 'Use pelo menos 8 caracteres.'); return; }
      if (nova !== repete) { caixaErro.innerHTML = msg('erro', 'As duas senhas não são iguais.'); return; }
      ocupar(form, true, 'Salvando…');
      const { error } = await sb.auth.updateUser({ password: nova });
      ocupar(form, false);
      if (error) {
        const t = `${error.code || ''} ${error.message || ''}`.toLowerCase();
        caixaErro.innerHTML = msg('erro', /weak|fraca|password should/.test(t) ? 'Senha fraca: use letras e números, com pelo menos 8 caracteres.'
          : /same_password|different from the old/.test(t) ? 'A nova senha precisa ser diferente da atual.'
          : 'Não foi possível salvar a senha: ' + esc(error.message || 'erro desconhecido') + '.');
        return;
      }
      aoSalvar();
    });
    const voltar = c.querySelector('#acesso-voltar');
    if (voltar) voltar.addEventListener('click', () => podeVoltar());
  }

  function telaSemAcesso(email) {
    const c = corpo(`
      <p class="acesso-texto"><b>Seu acesso ainda não foi liberado.</b><br>Você entrou como <b>${esc(email)}</b>, mas este e-mail não está na lista de quem pode ver o Mapa. Peça ao responsável para liberar o seu acesso.</p>
      <button type="button" class="btn" id="acesso-sair">Sair e entrar com outro e-mail</button>`);
    c.querySelector('#acesso-sair').addEventListener('click', sair);
  }
  function telaErro(texto, podeTentar = true) {
    const c = corpo(`${msg('erro', texto)}${podeTentar ? '<button type="button" class="btn" id="acesso-tentar">Tentar de novo</button>' : ''}`);
    const b = c.querySelector('#acesso-tentar');
    if (b) b.addEventListener('click', () => location.reload());
  }

  function liberarMapa() {
    if (tela) {
      tela.classList.add('saindo');
      const t = tela; tela = null;
      setTimeout(() => { t.remove(); document.documentElement.style.overflow = ''; }, 280);
    }
    observarRodape();
    liberar();
  }

  /* ---------- conta no rodapé do menu lateral: quem está conectado, trocar senha e sair ---------- */
  function garantirConta() {
    const rod = document.getElementById('rodape-lateral');
    if (!rod || !sessao || rod.querySelector('.mapa-conta')) return;
    const div = document.createElement('div');
    div.className = 'mapa-conta';
    div.innerHTML = `<span class="quem">Conectado como ${esc(sessao.user.email || '')}</span><button type="button" data-conta="senha">Trocar senha</button><button type="button" data-conta="sair">Sair</button>`;
    rod.appendChild(div);
  }
  let observandoRodape = false;
  function observarRodape() {
    if (observandoRodape) return;
    observandoRodape = true;
    garantirConta();
    new MutationObserver(garantirConta).observe(document.body, { childList: true, subtree: true });
    document.addEventListener('click', ev => {
      const b = ev.target.closest && ev.target.closest('.mapa-conta button');
      if (!b) return;
      if (b.dataset.conta === 'sair') sair();
      if (b.dataset.conta === 'senha') trocarSenha();
    });
  }
  function trocarSenha() {
    const fechar = () => { if (tela) { tela.remove(); tela = null; document.documentElement.style.overflow = ''; } };
    telaNovaSenha({
      titulo: 'Trocar senha', texto: 'Escolha uma nova senha com pelo menos 8 caracteres.',
      aoSalvar: () => { corpo(`${msg('ok', 'Senha trocada.')}<button type="button" class="btn primario" id="acesso-ok">Voltar ao Mapa</button>`, '#acesso-ok').querySelector('#acesso-ok').addEventListener('click', fechar); },
      podeVoltar: fechar
    });
  }
  async function sair() {
    try { await sb.auth.signOut(); } catch (e) { /* sai mesmo sem resposta do servidor */ }
    location.replace(location.pathname + location.search);
  }

  /* ---------- verificação de acesso ---------- */
  async function verificarAcesso() {
    carregando('Verificando o seu acesso…');
    const r = await sb.rpc('papel_atual');
    if (r.error) {
      const t = `${r.error.code || ''} ${r.error.message || ''}`;
      if (/PGRST202|PGRST205|42883|42P01|could not find/i.test(t)) telaErro('O banco ainda não foi preparado: rode o script publicacao/supabase.sql no Supabase (veja o README).', false);
      else if (!r.status || r.status >= 500) telaErro('Sem conexão com o banco de dados. Verifique a internet e tente de novo.');
      else telaErro('Não foi possível verificar o seu acesso: ' + esc(r.error.message || 'erro desconhecido') + '.');
      return;
    }
    papel = typeof r.data === 'string' ? r.data : null;
    if (!papel) { telaSemAcesso(sessao.user.email || ''); return; }
    liberarMapa();
  }

  async function carregarBiblioteca() {
    if (window.supabase && window.supabase.createClient) return true;
    await new Promise(res => {
      const s = document.createElement('script');
      s.src = SDK_RESERVA; s.onload = res; s.onerror = res;
      document.head.appendChild(s);
    });
    return !!(window.supabase && window.supabase.createClient);
  }
  async function lerConfig() {
    if (window.MAPA_SUPABASE && window.MAPA_SUPABASE.url) return window.MAPA_SUPABASE;
    const r = await fetch(CONFIG_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error('config ' + r.status);
    return r.json();
  }

  async function iniciar() {
    montarTela();
    carregando('Conectando…');
    if (!(await carregarBiblioteca())) { telaErro('Não foi possível carregar o componente de acesso. Verifique a internet e tente de novo.'); return; }
    let cfg;
    try { cfg = await lerConfig(); } catch (e) { telaErro('Não foi possível ler a configuração do site. Tente de novo em instantes.'); return; }
    if (!cfg || !cfg.url || !cfg.chave) {
      telaErro('O Mapa ainda não foi ligado ao banco de dados. Quem publica precisa conectar o Supabase ao projeto na Vercel (variáveis SUPABASE_URL e SUPABASE_ANON_KEY). Veja o README.', false);
      return;
    }
    sb = window.supabase.createClient(cfg.url, cfg.chave, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' } });
    if (pedidoSair) { await sair(); return; }
    const { data } = await sb.auth.getSession();
    sessao = data && data.session;
    sb.auth.onAuthStateChange((evento, nova) => {
      if (nova) sessao = nova;
      // sessão encerrada em outra aba ou expirada: volta para a entrada
      if (evento === 'SIGNED_OUT' && papel) location.replace(location.pathname + location.search);
    });
    if (erroLink) { telaEntrar(msg('erro', 'O link do e-mail expirou ou já foi usado. Peça um novo em "Esqueci minha senha".')); history.replaceState(null, '', location.pathname + location.search); return; }
    if (sessao && (tipoLink === 'recovery' || tipoLink === 'invite')) {
      telaNovaSenha({
        titulo: tipoLink === 'invite' ? 'Crie a sua senha' : 'Defina uma nova senha',
        texto: tipoLink === 'invite' ? 'Bem-vindo ao Mapa de Produtividade. Escolha uma senha com pelo menos 8 caracteres.' : 'Escolha uma nova senha com pelo menos 8 caracteres.',
        aoSalvar: () => { history.replaceState(null, '', location.pathname + location.search); verificarAcesso(); },
        podeVoltar: null
      });
      return;
    }
    if (!sessao) { telaEntrar(); return; }
    verificarAcesso();
  }
  // "#sair" digitado no endereço de uma aba já aberta
  window.addEventListener('hashchange', () => { if (location.hash === '#sair' && sb) sair(); });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();

</script>

  --fs-xs: 11.5px; --fs-sm: 12.5px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px; --fs-2xl: 26px;

}

.bloco { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; min-width: 0; }

/* cartões de indicador */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 12px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0;
  cursor: pointer; color: var(--text); position: relative;
}

button.kpi .rot { padding-right: 18px; }

.selo.rotas { border-color: color-mix(in srgb, var(--warn) 60%, var(--border)); color: var(--warn-ink); }
.selo.suspeito { border-color: color-mix(in srgb, var(--bad) 60%, var(--border)); color: var(--bad-ink); }
.selo.campeao { background: var(--simao); border-color: var(--simao); color: #fff; }
.selo.fechado { border-color: var(--border-strong); color: var(--text-2); }
.selo.revisar { border-color: color-mix(in srgb, var(--warn) 60%, var(--border)); color: var(--warn-ink); }
.func-tag { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); white-space: nowrap; }
.func-tag i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.mov { font-size: var(--fs-xs); font-weight: 700; white-space: nowrap; }
.mov.sobe { color: var(--ok-ink); }
.mov.desce { color: var(--bad-ink); }
.mov.igual { color: var(--text-2); }
.mov.novo { color: var(--simao-ink); font-weight: 500; }

/* avisos */
.aviso { display: flex; gap: 10px; align-items: flex-start; border-radius: 10px; padding: 11px 14px; font-size: var(--fs-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
.aviso svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.aviso.atencao { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--text); }
.aviso.atencao svg { color: var(--warn-ink); }
.aviso.erro { background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.aviso.erro svg { color: var(--bad-ink); }
.aviso.ok { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.aviso.ok svg { color: var(--ok-ink); }
.aviso.info svg { color: var(--text-2); }
.aviso b { font-weight: 700; }
.aviso .acoes-aviso { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }

/* tabelas */
.tabela-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.tbl th {
  text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--th); background: var(--surface-2); padding: 9px 10px; border-bottom: 1px solid var(--border-strong);
  white-space: nowrap; position: sticky; top: 0; z-index: 1;
}
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td.c, .tbl th.c { text-align: center; }
.tbl tr.clicavel { cursor: pointer; }
.tbl tr.clicavel:hover td { background: var(--hover); }
.tbl tr.inelegivel td { color: var(--muted); }
.tbl tr.inelegivel td .pill { opacity: .9; }
.tbl tr.destaque-topo td:first-child { box-shadow: inset 3px 0 0 var(--ok); }
.tbl tr.destaque-fim td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.tbl tr.sep-grupo td { background: var(--surface-2); color: var(--text-2); font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding-top: 12px; }
.tbl tr.total td { font-weight: 700; background: var(--surface-2); }
.tbl td .nome { font-weight: 500; color: var(--text); white-space: nowrap; }
.pos-cel { align-items: center; gap: 8px; flex: none; }
.tbl td .cod { color: var(--muted); font-size: var(--fs-xs); margin-left: 4px; }
.tbl .pos { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; border-radius: 8px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); font-variant-numeric: tabular-nums; }
.tbl .pos.p1 { background: var(--simao); border-color: var(--simao); color: #fff; }
.tbl .pos.p2, .tbl .pos.p3 { background: var(--simao-tint); border-color: color-mix(in srgb, var(--simao) 35%, var(--border)); color: var(--simao-ink); }
.tbl .acoes-linha { display: flex; gap: 4px; justify-content: flex-end; }
.tbl td.dif-zero { color: var(--ok-ink); font-weight: 700; }
.tbl td.dif-erro { color: var(--bad-ink); font-weight: 700; }
.nota-tabela { font-size: var(--fs-xs); color: var(--text-2); margin-top: 8px; }
.vazio-tabela { padding: 18px; text-align: center; color: var(--text-2); font-size: var(--fs-sm); }

/* mapa de calor */
.calor-wrap { overflow-x: auto; }
table.calor { border-collapse: separate; border-spacing: 3px; font-size: 12px; min-width: 100%; }
.calor th { font-size: 10.5px; font-weight: 700; color: var(--th); text-transform: uppercase; letter-spacing: .06em; padding: 4px 6px; white-space: nowrap; }
.calor th.mes-atual { color: var(--simao-ink); }
.calor td.nome { white-space: nowrap; padding-right: 10px; font-weight: 500; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.calor td.cel {
  min-width: 54px; height: 34px; text-align: center; border-radius: 6px; font-variant-numeric: tabular-nums; font-weight: 500;
  cursor: pointer; border: 1px solid transparent; padding: 0 4px;
}
.calor td.cel:hover, .calor td.cel:focus-visible { border-color: var(--text); }
.calor td.cel.sem-dado, .calor td.cel.sem-dado:hover { cursor: default; background: transparent; color: var(--muted); border-color: transparent; }
.calor td.cel.acima { background: var(--ok-bg); color: var(--ok-ink); }
.calor td.cel.acima.forte { background: color-mix(in srgb, var(--ok) 32%, var(--surface)); }
.calor td.cel.na { background: var(--warn-bg); color: var(--warn-ink); }
.calor td.cel.abaixo { background: var(--bad-bg); color: var(--bad-ink); }
.calor td.cel.abaixo.forte { background: color-mix(in srgb, var(--bad) 30%, var(--surface)); }
.calor td.cel.insuf { background: var(--na-bg); color: var(--na-ink); font-weight: 400; font-size: 11px; }
.calor td.cel.mes-atual { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--simao) 55%, transparent); }
.calor td.cel.sem-dado.mes-atual { box-shadow: none; background: color-mix(in srgb, var(--text) 4%, transparent); }
.legenda { display: flex; flex-wrap: wrap; gap: 12px; font-size: var(--fs-xs); color: var(--text-2); align-items: center; }
.legenda .it { display: inline-flex; align-items: center; gap: 6px; }
.legenda .sw { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
.legenda .ln { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
.legenda .ln.trac { border-top-style: dashed; }

/* gráficos */
.grafico { position: relative; width: 100%; min-width: 0; }
.grafico canvas { display: block; width: 100% !important; }
.grafico.alt-220 { height: 220px; } .grafico.alt-260 { height: 260px; } .grafico.alt-300 { height: 300px; } .grafico.alt-340 { height: 340px; }
.grafico-carregando { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: var(--fs-sm); }
.alternar-tabela { font-size: var(--fs-xs); }

/* barras de meta (bala) */
.balas { display: flex; flex-direction: column; gap: 14px; }
.bala { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr) auto; gap: 12px; align-items: center; cursor: pointer; border-radius: 8px; padding: 6px; background: none; border: 0; text-align: left; width: 100%; color: var(--text); }
.bala:hover { background: var(--hover); }
.bala .trilho { position: relative; height: 14px; background: var(--grid); border-radius: 4px; }
.bala .faixa { position: absolute; top: -3px; bottom: -3px; background: color-mix(in srgb, var(--warn) 22%, transparent); border-radius: 2px; }
.bala .barra { position: absolute; left: 0; top: 2px; bottom: 2px; border-radius: 0 4px 4px 0; }
.bala .meta { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--text); border-radius: 1px; }
.bala .valores { font-size: var(--fs-sm); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bala .valores b { font-size: 15px; }

/* distribuição por situação */
.dist { display: flex; flex-direction: column; gap: 12px; }
.dist .lin { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr); gap: 12px; align-items: center; }
.dist .pilha-barra { display: flex; height: 26px; gap: 2px; border-radius: 6px; overflow: hidden; }
.dist .seg-barra { display: grid; place-items: center; font-size: 11.5px; font-weight: 700; cursor: pointer; border: 0; min-width: 4px; padding: 0; color: inherit; }
.dist .seg-barra.acima { background: var(--ok); color: #fff; }
.dist .seg-barra.na { background: var(--warn); color: #2B2321; }
.dist .seg-barra.abaixo { background: var(--bad); color: #fff; }
.dist .seg-barra.insuf { background: var(--na-bg); color: var(--na-ink); }

/* pódio */
.podios { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.podio { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.podio h4 { display: flex; align-items: center; gap: 8px; }
.podio .lista { display: flex; flex-direction: column; gap: 6px; }
.podio .item { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; text-align: left; width: 100%; color: var(--text); }
.podio .item:hover { background: var(--hover); }
.podio .item .pos { font-weight: 700; font-size: 15px; color: var(--text-2); text-align: center; font-variant-numeric: tabular-nums; }
.podio .item.campeao { border-color: color-mix(in srgb, var(--simao) 60%, var(--border)); background: var(--simao-tint); }
.podio .item.campeao .pos { color: var(--simao-ink); }
.podio .item .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podio .item .vl { font-size: var(--fs-sm); font-variant-numeric: tabular-nums; text-align: right; }
.podio .sub-rot { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); font-weight: 700; margin-top: 4px; }

/* leitura gerencial */
.leitura { display: flex; flex-direction: column; gap: 2px; }
.frase { display: flex; gap: 12px; align-items: flex-start; padding: 10px 8px; border-radius: 9px; border: 0; background: none; text-align: left; cursor: pointer; width: 100%; color: var(--text); font-size: var(--fs-md); }
.frase:hover { background: var(--hover); }
.frase .marcador { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; }
.frase .marcador svg { width: 15px; height: 15px; }
.frase .marcador.t-alerta { background: var(--bad-bg); color: var(--bad-ink); }
.frase .marcador.t-atencao { background: var(--warn-bg); color: var(--warn-ink); }
.frase .marcador.t-info { background: var(--na-bg); color: var(--text-2); }
.frase .marcador.t-bom { background: var(--ok-bg); color: var(--ok-ink); }
.frase .txt { flex: 1; min-width: 0; }
.frase .txt b { font-weight: 700; }
.frase .ir { flex: none; color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; margin-top: 4px; }

/* formulários */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form .full { grid-column: 1 / -1; }
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo label { font-size: var(--fs-sm); color: var(--text-2); font-weight: 500; }
.campo .ajuda { font-size: var(--fs-xs); color: var(--muted); }
.inp, .txa {
  width: 100%; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
  padding: 9px 11px; min-height: 40px; font-size: var(--fs-md); color: var(--text);
}
.txa { min-height: 76px; resize: vertical; }
.inp:focus, .txa:focus, .sel:focus { outline: 2px solid color-mix(in srgb, var(--simao) 60%, transparent); outline-offset: 0; border-color: var(--simao); }
.inp[readonly] { background: var(--surface-2); color: var(--text-2); }
.campo.erro .inp, .campo.erro .sel { border-color: var(--bad); }
.campo .msg-erro { font-size: var(--fs-xs); color: var(--bad-ink); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: var(--fs-md); min-height: 32px; }
.check input { width: 18px; height: 18px; accent-color: var(--simao); }

/* importação */
.soltar {
  border: 2px dashed var(--border-strong); border-radius: 14px; padding: 34px 18px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--surface-2); cursor: pointer;
}
.soltar.ativo { border-color: var(--simao); background: var(--simao-tint); }
.soltar svg { width: 34px; height: 34px; color: var(--simao); }
.soltar .t { font-size: var(--fs-lg); font-weight: 500; }
.etapas { display: flex; gap: 8px; flex-wrap: wrap; font-size: var(--fs-sm); }
.etapas .et { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.etapas .et b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--na-bg); color: var(--text-2); font-size: 12px; }
.etapas .et.atual { color: var(--text); font-weight: 500; }
.etapas .et.atual b { background: var(--simao); color: #fff; }
.etapas .et.feita b { background: var(--ok); color: #fff; }
.lista-validacao { display: flex; flex-direction: column; gap: 8px; }

/* quadro do plano de ação */
.quadro { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.coluna-quadro { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 120px; }
.coluna-quadro h4 { display: flex; align-items: center; gap: 8px; }
.coluna-quadro h4 .qt { margin-left: auto; font-size: var(--fs-xs); color: var(--text-2); font-weight: 500; }
.cartao-acao { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.cartao-acao .o-que { font-weight: 500; }
.cartao-acao .meta-acao { font-size: var(--fs-xs); color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.cartao-acao .vencida { color: var(--bad-ink); font-weight: 700; }

/* alertas */
.lista-alertas { display: flex; flex-direction: column; gap: 10px; }
.alerta { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); }
.alerta .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.alerta .ic svg { width: 16px; height: 16px; }
.alerta.alta .ic { background: var(--bad-bg); color: var(--bad-ink); }
.alerta.media .ic { background: var(--warn-bg); color: var(--warn-ink); }
.alerta.info .ic { background: var(--na-bg); color: var(--text-2); }
.alerta .tt { font-weight: 500; }
.alerta .tx { font-size: var(--fs-sm); color: var(--text-2); margin-top: 2px; }
.alerta .acs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* calendário */
.calendario { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; max-width: 520px; }
.calendario .dsem { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); text-align: center; font-weight: 700; padding-bottom: 2px; }
.calendario .dia { border: 1px solid var(--border); border-radius: 8px; min-height: 48px; padding: 4px 5px; display: flex; flex-direction: column; gap: 3px; background: var(--surface); }
.calendario .dia.fora { border-style: dashed; background: transparent; }
.calendario .dia.vazio { border: 0; background: transparent; }
.calendario .dia .n { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.calendario .dia .marcas { display: flex; gap: 3px; flex-wrap: wrap; }
.calendario .dia .marcas i { width: 100%; height: 5px; border-radius: 3px; display: block; }
.calendario .dia.trabalhou { border-color: var(--border-strong); }

/* ficha */
.ficha-cab { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.avatar { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; font-weight: 700; font-size: 19px; color: #fff; flex: none; }
.ficha-cab .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ficha-cab .info .linha { gap: 6px; }
.busca { position: relative; max-width: 520px; width: 100%; }
.busca .inp { padding-left: 38px; }
.busca svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); }
.sugestoes { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow-pop); z-index: 15; max-height: 320px; overflow-y: auto; }
.sugestoes button { display: flex; width: 100%; gap: 10px; padding: 10px 12px; border: 0; background: none; text-align: left; cursor: pointer; align-items: center; color: var(--text); }
.sugestoes button:hover, .sugestoes button.ativo { background: var(--hover); }
.grade-colab { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.cartao-colab { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; color: var(--text); width: 100%; }
.cartao-colab:hover { background: var(--hover); }
.cartao-colab .av { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: none; }
.cartao-colab .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cartao-colab .sb { font-size: var(--fs-xs); color: var(--text-2); }

/* abas internas */
.abas { display: flex; gap: 4px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.abas button { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: var(--fs-md); min-height: 44px; }
.abas button[aria-selected="true"] { color: var(--simao-ink); border-bottom-color: var(--simao); font-weight: 500; }
.abas button:hover { color: var(--text); }

/* diálogo */
.modal-fundo { position: fixed; inset: 0; background: var(--scrim); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal {
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-pop); width: min(680px, 100%);
  max-height: calc(100dvh - 32px); display: flex; flex-direction: column; border: 1px solid var(--border);
}
.modal.largo { width: min(980px, 100%); }
.modal .cab-modal { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal .corpo-modal { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal .pe-modal { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.progresso { height: 8px; background: var(--grid); border-radius: 999px; overflow: hidden; }
.progresso i { display: block; height: 100%; background: var(--simao); width: 0; transition: width .2s; }

/* aviso flutuante */
.avisos-flutuantes { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--text); color: var(--bg); border-radius: 10px; padding: 11px 14px; font-size: var(--fs-sm); box-shadow: var(--shadow-pop); display: flex; gap: 10px; align-items: flex-start; }
.toast.erro { background: var(--bad); color: #fff; }
.toast.ok { background: var(--ok-ink); color: #fff; }

/* dica */
.dica-flutuante { position: fixed; z-index: 90; background: var(--text); color: var(--bg); font-size: 12px; line-height: 1.4; padding: 8px 10px; border-radius: 8px; max-width: 300px; pointer-events: none; box-shadow: var(--shadow-pop); white-space: pre-line; }
[data-dica] { cursor: help; }
button[data-dica], tr[data-dica], td[data-dica], .kpi[data-dica], .clicavel[data-dica] { cursor: pointer; }
.info-i { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border-strong); color: var(--text-2); font-size: 10px; font-weight: 700; flex: none; }

/* estado vazio */
.vazio { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 44px 18px; }
.vazio svg { width: 46px; height: 46px; color: var(--border-strong); }
.vazio h2 { font-size: 19px; }
.vazio p { color: var(--text-2); max-width: 52ch; }
.carregando { display: flex; align-items: center; gap: 10px; color: var(--text-2); padding: 30px 0; }
.giro { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--simao); animation: giro .8s linear infinite; }
@keyframes giro { to { transform: rotate(360deg); } }

/* texto corrido */
.texto { max-width: 78ch; display: flex; flex-direction: column; gap: 10px; }
.texto p, .texto li { color: var(--text); }
.texto ol, .texto ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.glossario { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.termo { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
.termo dt { font-weight: 700; color: var(--title); }
.termo dd { margin: 4px 0 0; font-size: var(--fs-sm); color: var(--text); display: flex; flex-direction: column; gap: 4px; }
.termo .formula { font-family: var(--font); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; width: fit-content; max-width: 100%; font-size: 12.5px; }

/* barra inferior e gaveta (celular) */
.barra-inferior { display: none; }
.fundo-gaveta { display: none; }
.so-celular { display: none !important; }

@media (max-width: 1180px) {
  .grade-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .podios { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 980px) {
  .grade-2 { grid-template-columns: minmax(0, 1fr); }
  .quadro { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 768px) {
  :root { --top-h: 54px; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .lateral {
    position: fixed; left: 0; top: 0; bottom: 0; width: min(300px, 86vw); height: auto;
    transform: translateX(-102%); transition: transform .22s ease; box-shadow: var(--shadow-pop); z-index: 70;
  }
  .lateral.aberta { transform: none; }
  .fundo-gaveta.aberta { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 65; }
  .topo-linha { padding: 8px 16px; gap: 8px; }
  .filtros-linha2 { padding: 0 16px 8px; }
  .topo .titulo-sistema .t1, .topo .titulo-sistema .t2, .topo .titulo-sistema .sep { display: none; }
  .filtros-linha2 { display: none; }
  .topo.filtros-abertos .filtros-linha2 { display: flex; }
  .btn-filtros { position: relative; }
  .btn-filtros .marca-filtro { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--simao); }
  .topo .titulo-sistema .t1 { font-size: 14px; }
  .topo .logo-mini { display: block; }
  .so-desktop { display: none !important; }
  .so-celular { display: inline-flex !important; }
  .conteudo { padding: 14px 16px calc(92px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
  .grade-3, .grade-2, .podios { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi { padding: 12px; }
  .kpi .val { font-size: 21px; }
  .bloco { padding: 14px; }
  .form { grid-template-columns: minmax(0, 1fr); }
  .bala { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .bala .valores { text-align: left; }
  .dist .lin { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .barra-inferior {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px));
  }
  .barra-inferior button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border: 0; background: none; color: var(--text-2); font-size: 11px; cursor: pointer; border-radius: 10px; }
  .barra-inferior button svg { width: 21px; height: 21px; }
  .barra-inferior button[aria-current="page"] { color: var(--simao-ink); font-weight: 500; }
  .menu-item { min-height: 44px; }
  .btn { min-height: 44px; }
  .btn-icone { width: 44px; height: 44px; min-width: 44px; min-height: 44px; }
  .btn.peq { min-height: 44px; }
  .seg button { min-height: 44px; }
  .sel { min-height: 44px; }
  .avisos-flutuantes { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); left: 16px; right: 16px; max-width: none; }

  /* tabelas viram cartões empilhados */
  .tabela-wrap.cartoes { overflow: visible; }
  table.tbl.cartoes, .tbl.cartoes tbody, .tbl.cartoes tr, .tbl.cartoes td { display: block; width: 100%; }
  .tbl.cartoes thead { display: none; }
  .tbl.cartoes tr { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; padding: 10px 12px; background: var(--surface); }
  .tbl.cartoes tr.sep-grupo { border: 0; background: none; padding: 6px 2px; margin: 8px 0 4px; }
  .tbl.cartoes tr.sep-grupo td { background: none; padding: 0; }
  .tbl.cartoes td { border: 0; padding: 4px 0; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
  .tbl.cartoes td::before { content: attr(data-rotulo); color: var(--text-2); font-size: var(--fs-xs); text-align: left; flex: none; max-width: 48%; }
  .tbl.cartoes td[data-rotulo=""]::before { content: none; }
  .tbl.cartoes td.prim { font-size: 15px; justify-content: flex-start; text-align: left; gap: 10px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .tbl.cartoes td.prim::before { content: none; }
  .tbl.cartoes td.oculto-cel { display: none; }
  .tbl.cartoes td.n { white-space: normal; }
  .tbl.cartoes td .cv { min-width: 0; text-align: right; overflow-wrap: anywhere; }
  .tbl.cartoes td .btn { white-space: normal; text-align: left; }
  .tbl.cartoes td.prim .nome-bloco { min-width: 0; }
  .tbl.cartoes tr.clicavel:hover td { background: none; }
  .tbl.cartoes .acoes-linha { justify-content: flex-start; flex-wrap: wrap; }
  .tbl.cartoes .pos { min-width: 40px; height: 40px; font-size: 18px; border-radius: 11px; }
  .tbl.cartoes tr.destaque-topo, .tbl.cartoes tr.destaque-fim { box-shadow: none; }
  .tbl.cartoes tr.destaque-topo { border-left: 4px solid var(--ok); }
  .tbl.cartoes tr.destaque-fim { border-left: 4px solid var(--bad); }
  .tbl.cartoes tr.destaque-topo td:first-child, .tbl.cartoes tr.destaque-fim td:first-child { box-shadow: none; }
  .alerta { grid-template-columns: auto minmax(0, 1fr); }
  .alerta .acs { grid-column: 1 / -1; justify-content: flex-start; }
  .frase .ir { display: none; }
  .calendario .dia { min-height: 40px; }
}
@media (max-width: 420px) {
  .kpis { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .kpi .val { font-size: 19px; }
  .topo .titulo-sistema .t1 { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

const $ = (sel, raiz = document) => raiz.querySelector(sel);

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function attrs(obj) {
  return Object.entries(obj || {}).filter(([, v]) => v !== undefined && v !== null && v !== false)
    .map(([k, v]) => v === true ? ` ${k}` : ` ${k}="${esc(v)}"`).join('');
}
function dataAcao(acao, params) {
  return attrs({ 'data-acao': acao, 'data-p': params ? JSON.stringify(params) : undefined });
}

const ok = v => v !== null && v !== undefined && Number.isFinite(v);
const fInt = v => ok(v) ? NF.i.format(v) : TRACO;
const fD1 = v => ok(v) ? NF.d1.format(v) : TRACO;
const fD2 = v => ok(v) ? NF.d2.format(v) : TRACO;
const fDx = v => ok(v) ? NF.dx.format(v) : TRACO;
const fPct = v => ok(v) ? NF.p0.format(v) : TRACO;
const fPct1 = v => ok(v) ? NF.p1.format(v) : TRACO;
function fNum(v, formato) {
  switch (formato) {
    case 'int': return fInt(v);
    case 'd1': return fD1(v);
    case 'd2': return fD2(v);
    case 'dx': return fDx(v);
    case 'pct': return fPct(v);
    case 'pct1': return fPct1(v);
    default: return ok(v) ? String(v) : (v ?? '');
  }
}
function fSinal(v, formato) {
  if (!ok(v)) return TRACO;
  const s = fNum(Math.abs(v), formato);
  return (v > 0 ? '+' : v < 0 ? '−' : '') + s;
}
function compacto(v) {
  if (!ok(v)) return TRACO;
  const a = Math.abs(v);
  if (a >= 1e6) return NF.d1.format(v / 1e6) + ' mi';
  if (a >= 1e4) return NF.i.format(v / 1e3) + ' mil';
  return NF.i.format(v);
}
const div = (a, b) => (ok(a) && ok(b) && b !== 0) ? a / b : null;
const soma = (arr, f) => arr.reduce((s, x) => s + (f ? (f(x) || 0) : (x || 0)), 0);
function arred(v, casas = 0) { const m = 10 ** casas; return Math.round(v * m) / m; }
function mediana(valores) {
  const v = valores.filter(ok).slice().sort((a, b) => a - b);
  if (!v.length) return null;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}
/* percentil inclusivo, igual ao PERCENTIL/QUARTIL do Excel (PERCENTILE.INC) */
function percentilInc(valores, p) {
  const v = valores.filter(ok).slice().sort((a, b) => a - b);
  if (!v.length) return null;
  const pos = (v.length - 1) * p, lo = Math.floor(pos), hi = Math.ceil(pos);
  return v[lo] + (v[hi] - v[lo]) * (pos - lo);
}

/* ---------- texto ---------- */
/* tira o ponto final para a frase poder ser composta sem ".." */
function semPonto(t) { return String(t ?? '').trim().replace(/[.;]+$/, ''); }
function norm(s) {
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[³]/g, '3').replace(/[^a-z0-9]+/g, ' ').trim();
}
const PREPOSICOES = new Set(['da', 'de', 'do', 'das', 'dos', 'e']);
const ACENTOS_NOMES = { joao: 'João', deoclecio: 'Deoclécio' };
function capitalizar(p) {
  const k = norm(p);
  if (ACENTOS_NOMES[k]) return ACENTOS_NOMES[k];
  const low = p.toLocaleLowerCase('pt-BR');
  return low.charAt(0).toLocaleUpperCase('pt-BR') + low.slice(1);
}
function nomeCurtoDe(nome) {
  const partes = String(nome || '').trim().split(/\s+/).filter(Boolean);
  if (!partes.length) return '';
  const uteis = partes.filter(p => !PREPOSICOES.has(norm(p)));
  if (uteis.length <= 1) return capitalizar(uteis[0] || partes[0]);
  return capitalizar(uteis[0]) + ' ' + capitalizar(uteis[uteis.length - 1]);
}
function nomeTitulo(nome) {
  return String(nome || '').trim().split(/\s+/).map(p => PREPOSICOES.has(norm(p)) ? p.toLocaleLowerCase('pt-BR') : capitalizar(p)).join(' ');
}
function iniciais(nome) {
  const p = String(nome || '').trim().split(/\s+/).filter(x => !PREPOSICOES.has(norm(x)));
  return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}
function corAvatar(codigo) {
  const cores = ['#7D0003', '#B53A1E', '#8D2661', '#4C7FD3', '#2F6E62', '#6B4E9B', '#A2541A', '#5D6B2E'];
  let h = 0; for (const c of String(codigo)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return cores[h % cores.length];
}
function plural(n, um, varios) { return `${fInt(n)} ${n === 1 ? um : varios}`; }

/* ---------- meses ---------- */
/* ym = índice mensal contínuo (ano*12 + mês-1): facilita "mês anterior" atravessando o ano */
const ymDe = (ano, mes) => ano * 12 + (mes - 1);
const anoDe = ym => Math.floor(ym / 12);
const mesDe = ym => (ym % 12) + 1;
const chaveYM = ym => `${anoDe(ym)}-${String(mesDe(ym)).padStart(2, '0')}`;
function ymDeChave(ch) { const m = /^(\d{4})-(\d{2})$/.exec(String(ch || '')); return m ? ymDe(+m[1], +m[2]) : null; }
const rotuloYM = ym => `${MESES[mesDe(ym) - 1]}/${anoDe(ym)}`;
const rotuloYMCurto = ym => `${MESES_CURTOS[mesDe(ym) - 1]}/${String(anoDe(ym)).slice(2)}`;
const nomeMes = ym => MESES[mesDe(ym) - 1];
const diasNoMes = (ano, mes) => new Date(ano, mes, 0).getDate();
function mesDoTexto(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number' && v >= 1 && v <= 12) return Math.round(v);
  if (v instanceof Date && !isNaN(v)) return v.getMonth() + 1;
  const t = norm(v);
  if (!t) return null;
  if (/^\d{1,2}$/.test(t) && +t >= 1 && +t <= 12) return +t;
  const nomes = MESES.map(m => norm(m));
  let i = nomes.indexOf(t);
  if (i >= 0) return i + 1;
  i = nomes.findIndex(n => t.startsWith(n.slice(0, 3)));
  return i >= 0 ? i + 1 : null;
}
function rotuloPeriodo(inicio, fim) {
  if (inicio === fim) return rotuloYM(fim);
  if (anoDe(inicio) === anoDe(fim)) return `${MESES_CURTOS[mesDe(inicio) - 1]}–${MESES_CURTOS[mesDe(fim) - 1]}/${anoDe(fim)}`;
  return `${rotuloYMCurto(inicio)} a ${rotuloYMCurto(fim)}`;
}

/* ---------- datas ---------- */
function agoraISO() { return new Date().toISOString(); }
function fData(iso) {
  if (!iso) return TRACO;
  const d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso);
  if (isNaN(d)) return TRACO;
  return d.toLocaleDateString('pt-BR');
}
function fDataHora(iso) {
  if (!iso) return TRACO;
  const d = new Date(iso);
  if (isNaN(d)) return TRACO;
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function hojeISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function dataCurta(iso) { // '2026-09-22' -> '22/09'
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? `${m[3]}/${m[2]}` : '';
}

/* ---------- diversos ---------- */
function novoId(prefixo = '') {
  return prefixo + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function idLancamento(ano, mes, codigo, funcao) {
  return `${ano}-${String(mes).padStart(2, '0')}-${String(codigo).replace(/[^A-Za-z0-9_.~:@+-]/g, '_')}-${funcao}`;
}
function clonar(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
function iguais(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function porCodigo(a, b) {
  const na = Number(a), nb = Number(b);
  if (Number.isFinite(na) && Number.isFinite(nb)) return na - nb;
  return String(a).localeCompare(String(b), 'pt-BR');
}
function dormir(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ---- 10-store.js ---- */
/* =========================================================================
   Dados: conexão com o banco do artefato (db), quem está vendo (user),
   arquivos para baixar (downloads), assinaturas em tempo real e gravações.
   ========================================================================= */

const COLECOES = ['colaboradores', 'lancamentos', 'meses', 'parametros', 'metas', 'importacoes', 'planoAcao', 'historico'];

const S = {
  status: 'conectando',            // conectando | pronto | sem-runtime | sem-db | revogado
  carregado: Object.fromEntries(COLECOES.map(c => [c, false])),
  podeEditarBanco: false,          // canEdit() do runtime (nível de edição)
  ehDono: false,
  usuarioId: null,
  leituraForcada: false,           // uma gravação foi recusada: volta ao modo leitura
  motivoLeitura: '',
  colaboradores: new Map(),
  lancamentos: new Map(),
  meses: new Map(),
  parametros: { ...PARAMETROS_PADRAO },
  parametrosDoc: null,
  metas: new Map(),
  importacoes: new Map(),
  planoAcao: new Map(),
  historico: new Map(),
  versao: 0,
  ultimaAtualizacao: null
};
const CAP = { db: null, user: null, downloads: null };
const ASSINATURAS = {};
let gravando = 0;

function podeEditar() { return S.podeEditarBanco && !S.leituraForcada && S.status === 'pronto'; }
/* Salvar arquivos depende da capacidade downloads do visualizador; sem ela, os botões de exportação somem. */
function podeBaixar() { return !!CAP.downloads; }
function tudoCarregado() { return COLECOES.every(c => S.carregado[c]); }

/* ---------- normalização dos documentos lidos ---------- */
function numero(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
function normalizarLancamento(id, d) {
  const ano = Math.round(numero(d.ano)), mes = Math.round(numero(d.mes));
  const pedidos = numero(d.pedidos), nfs = numero(d.nfs);
  return {
    ...d, id,
    ano, mes, ym: ymDe(ano, mes),
    codigo: String(d.codigo ?? '').trim(),
    funcao: d.funcao,
    diasLista: Array.isArray(d.diasLista) ? d.diasLista.map(Number).filter(n => Number.isInteger(n)) : [],
    diasFuncao: numero(d.diasFuncao),
    pedidos, nfs, documentos: pedidos + nfs,
    skus: numero(d.skus),
    unidades: numero(d.unidades)
  };
}
function normalizarDoc(col, id, d) {
  if (col === 'lancamentos') return normalizarLancamento(id, d);
  if (col === 'colaboradores') return { ...d, codigo: String(d.codigo ?? id), id };
  return { ...d, id };
}

/* ---------- conexão ---------- */
async function conectar() {
  const claudeRt = window.claude;
  if (!claudeRt || typeof claudeRt.use !== 'function') {
    S.status = 'sem-runtime';
    agendarRender();
    return;
  }
  let db = null, user = null, downloads = null;
  try {
    [db, user, downloads] = await Promise.all([
      claudeRt.use('db').catch(() => null),
      claudeRt.use('user').catch(() => null),
      claudeRt.use('downloads').catch(() => null)
    ]);
  } catch (e) { /* tratado abaixo como ausência */ }
  CAP.db = db; CAP.user = user; CAP.downloads = downloads;
  if (user) {
    try {
      const [podeEd, dono, id] = await Promise.all([user.canEdit(), user.isOwner(), user.id()]);
      S.podeEditarBanco = !!podeEd;
      S.ehDono = !!dono;
      S.usuarioId = id || null;
    } catch (e) { S.podeEditarBanco = false; }
  }
  if (!db) {
    S.status = 'sem-db';
    agendarRender();
    return;
  }
  for (const col of COLECOES) assinar(col);
}

function assinar(col) {
  try { ASSINATURAS[col] && ASSINATURAS[col](); } catch (e) { /* já encerrada */ }
  let consulta = CAP.db.collection(col);
  if (col === 'historico') consulta = consulta.orderBy('quando', 'desc').limit(1000);
  ASSINATURAS[col] = consulta.onSnapshot(
    snap => aplicarSnapshot(col, snap),
    err => erroAssinatura(col, err)
  );
}

function aplicarSnapshot(col, snap) {
  const mapa = new Map();
  for (const d of snap.docs) {
    if (!d.exists) continue;
    const dados = d.data();
    if (!dados) continue;
    mapa.set(d.id, normalizarDoc(col, d.id, dados));
  }
  if (col === 'parametros') {
    const geral = mapa.get('geral') || null;
    S.parametrosDoc = geral;
    S.parametros = { ...PARAMETROS_PADRAO, ...(geral || {}) };
  } else {
    S[col] = mapa;
  }
  S.carregado[col] = true;
  S.versao++;
  S.ultimaAtualizacao = new Date();
  if (S.status === 'conectando' && tudoCarregado()) S.status = 'pronto';
  agendarRender();
}

function erroAssinatura(col, err) {
  const code = err && err.code;
  if (code === 'revoked') {
    S.status = 'revogado';
    agendarRender();
    return;
  }
  if (code === 'unavailable' || code === 'queue_overflow') {
    setTimeout(() => assinar(col), 2500 + Math.random() * 2500);
    return;
  }
  console.warn('Assinatura encerrada', col, err);
  S.carregado[col] = true;
  if (S.status === 'conectando' && tudoCarregado()) S.status = 'pronto';
  toast(`Não foi possível acompanhar "${col}" em tempo real. Recarregue a página se os números parecerem desatualizados.`, 'erro');
  agendarRender();
}

/* ---------- gravação ---------- */
function mensagemErroBanco(e) {
  const code = e && e.code;
  switch (code) {
    case 'invalid_argument': return 'O banco de dados recusou a gravação. Normalmente isso significa que esta conta não tem permissão de edição neste painel.';
    case 'quota_exceeded': return 'O limite de armazenamento do painel foi atingido. Exclua registros antigos (por exemplo, do histórico) antes de gravar.';
    case 'resource_exhausted': return 'Muitas gravações em sequência. Aguarde alguns segundos e tente de novo.';
    case 'revoked': return 'O acesso a este painel foi retirado enquanto a página estava aberta.';
    case 'not_granted': case 'capability_disabled': case 'capability_removed': return 'Esta visualização não permite gravar dados.';
    case 'unavailable': return 'O banco de dados está momentaneamente indisponível. Tente de novo em instantes.';
    default: return 'Não foi possível gravar: ' + ((e && e.message) || 'erro desconhecido') + '.';
  }
}
function ehRecusa(e) {
  const code = e && e.code;
  return code === 'invalid_argument' || code === 'not_granted' || code === 'revoked' || code === 'capability_disabled' || code === 'capability_removed';
}
function entrarModoLeitura(motivo) {
  S.leituraForcada = true;
  S.motivoLeitura = motivo;
  agendarRender();
}
function exigirEdicao() {
  if (!podeEditar()) {
    const e = new Error('Somente leitura');
    e.code = 'somente_leitura';
    throw e;
  }
}
function limparParaBanco(obj) {
  /* o banco aceita apenas JSON puro: remove undefined, NaN e funções */
  return JSON.parse(JSON.stringify(obj, (k, v) => (typeof v === 'number' && !Number.isFinite(v)) ? null : v));
}
async function executarOperacao(op) {
  const ref = CAP.db.collection(op.colecao).doc(op.id);
  if (op.tipo === 'excluir') return ref.delete();
  return ref.set(limparParaBanco(op.dados));
}
async function executarComRetentativa(op) {
  try { return await executarOperacao(op); }
  catch (e) {
    if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) {
      await dormir(600 + Math.random() * 900);
      return executarOperacao(op);
    }
    throw e;
  }
}
/* Executa gravações (até 4 em paralelo, nunca duas no mesmo documento). */
async function executarOperacoes(ops, aoProgredir) {
  exigirEdicao();
  const vistos = new Set();
  const unicas = [];
  for (const op of ops) {
    const chave = op.colecao + '/' + op.id;
    if (vistos.has(chave)) { const i = unicas.findIndex(o => o.colecao + '/' + o.id === chave); unicas[i] = op; continue; }
    vistos.add(chave); unicas.push(op);
  }
  let feitas = 0;
  const erros = [];
  const fila = unicas.slice();
  gravando++;
  agendarRender();
  async function trabalhador() {
    while (fila.length) {
      const op = fila.shift();
      try { await executarComRetentativa(op); }
      catch (e) {
        erros.push({ op, e });
        if (ehRecusa(e) || (e && e.code === 'quota_exceeded')) fila.length = 0;
      }
      feitas++;
      if (aoProgredir) aoProgredir(feitas, unicas.length);
    }
  }
  try {
    await Promise.all(Array.from({ length: Math.min(4, unicas.length) }, trabalhador));
  } finally {
    gravando--;
    agendarRender();
  }
  if (erros.length) {
    const e = erros[0].e;
    const msg = mensagemErroBanco(e);
    if (ehRecusa(e)) entrarModoLeitura(msg + ' A tela voltou ao modo leitura.');
    const err = new Error(msg);
    err.code = e && e.code;
    err.erros = erros;
    err.gravadas = feitas - erros.length;
    throw err;
  }
  return feitas;
}
function opGravar(colecao, id, dados) { return { tipo: 'gravar', colecao, id: String(id), dados }; }

function opHistorico({ tipo, colecao, alvo, alvos, resumo, antes, depois, mapa = false }) {
  return opGravar('historico', novoId('h'), {
    quando: agoraISO(),
    autorId: S.usuarioId || null,
    tipo,
    colecao: colecao || null,
    alvo: alvo || null,
    alvos: alvos || (alvo ? [alvo] : []),
    resumo: resumo || '',

/* Gravação com histórico e aviso de resultado; devolve true quando tudo foi gravado. */
async function gravarComHistorico(ops, historico, mensagemOk) {
  try {

/* ---- 20-motor.js ---- */
/* =========================================================================
   Motor de cálculo: metas vigentes, agregações (somar antes de dividir),
   índice de eficiência, ranking, presença/multifunção, indicadores da

   Tudo derivado dos documentos do banco; nada é inventado.

const MEMO = new Map();
let memoVersao = -1;
function memo(chave, fn) {
  if (memoVersao !== S.versao) { MEMO.clear(); memoVersao = S.versao; }
  if (!MEMO.has(chave)) MEMO.set(chave, fn());
  return MEMO.get(chave);
}
const P = () => S.parametros;
const EPS = 1e-9;

/* ---------- colaboradores ---------- */
function colab(codigo) { return S.colaboradores.get(String(codigo)) || null; }
function nomeKaizenDe(codigo) {
  return memo('nk|' + codigo, () => {
    let nome = '';
    for (const l of todosLancamentos()) if (l.codigo === String(codigo) && l.nomeKaizen) nome = l.nomeKaizen;
    return nome;
  });
}
function nomeExib(codigo) {
  const c = colab(codigo);
  if (c && c.nomeCurto) return c.nomeCurto;
  const nome = (c && c.nome) || nomeKaizenDe(codigo);
  return nome ? nomeCurtoDe(nome) : `Código ${codigo}`;
}
function nomeCompleto(codigo) {
  const c = colab(codigo);
  const nome = (c && c.nome) || nomeKaizenDe(codigo);
  return nome ? nomeTitulo(nome) : `Código ${codigo}`;
}
function estaDesligado(codigo, ym) {
  const c = colab(codigo);
  if (!c || c.status !== 'desligado') return false;
  if (ym === undefined) return true;
  const yd = ymDeChave((c.dataDesligamento || '').slice(0, 7));
  return yd == null ? true : ym >= yd;
}

/* ---------- lançamentos ---------- */
function todosLancamentos() {
  return memo('todos', () => [...S.lancamentos.values()].sort((a, b) => a.ym - b.ym || FUNCOES.findIndex(f => f.id === a.funcao) - FUNCOES.findIndex(f => f.id === b.funcao) || porCodigo(a.codigo, b.codigo)));
}
function lancamentosPeriodo(ini, fim, funcao) {
  return memo(`lp|${ini}|${fim}|${funcao || ''}`, () => todosLancamentos().filter(l => l.ym >= ini && l.ym <= fim && (!funcao || l.funcao === funcao)));
}
function lancamentosDoColab(codigo) {
  return memo('lc|' + codigo, () => todosLancamentos().filter(l => l.codigo === String(codigo)));
}
function mesesComDados() {
  return memo('mesesDados', () => [...new Set(todosLancamentos().map(l => l.ym))].sort((a, b) => a - b));
}
function mesesDisponiveis() {
  return memo('mesesDisp', () => {
    const s = new Set(mesesComDados());
    for (const k of S.meses.keys()) { const y = ymDeChave(k); if (y != null) s.add(y); }
    return [...s].sort((a, b) => a - b);

}
function primeiroMesDados() { const m = mesesComDados(); return m.length ? m[0] : null; }
function primeiraAtividade(codigo) { const ls = lancamentosDoColab(codigo); return ls.length ? ls[0].ym : null; }
function ultimaAtividade(codigo) { const ls = lancamentosDoColab(codigo); return ls.length ? ls[ls.length - 1].ym : null; }
function ehNovato(codigo, ym) {
  const prim = primeiraAtividade(codigo), base = primeiroMesDados();
  if (prim == null || base == null || prim <= base) return false;
  return ym >= prim && ym - prim < (P().mesesNovato || 3);

function codigosComDados() {

}
function todosCodigos() {

/* ---------- função principal ---------- */
function diasPorFuncao(codigo, ini = -Infinity, fim = Infinity) {
  const r = Object.fromEntries(FUNCOES.map(f => [f.id, 0]));
  for (const l of lancamentosDoColab(codigo)) if (l.ym >= ini && l.ym <= fim && r[l.funcao] !== undefined) r[l.funcao] += l.diasFuncao;
  return r;
}
function funcaoSugerida(codigo) {
  const d = diasPorFuncao(codigo);
  let melhor = null;
  for (const f of FUNCOES) if (d[f.id] > 0 && (melhor === null || d[f.id] > d[melhor])) melhor = f.id;
  return melhor;
}
function funcaoPrincipalDe(codigo) {

}

/* ---------- metas e meses ---------- */
function metasDaFuncao(funcao) {

    .filter(m => m.funcao === funcao)
    .map(m => ({ ...m, ymVig: ymDeChave(m.vigenciaDesde) }))
    .filter(m => m.ymVig != null)
    .sort((a, b) => a.ymVig - b.ymVig));
}
function metaVigente(funcao, ym) {
  let r = null;
  for (const m of metasDaFuncao(funcao)) if (m.ymVig <= ym) r = m;
  return r;
}
function diasOperacaoCalculado(ym) {
  return memo('dopc|' + ym, () => {
    const s = new Set();
    for (const l of lancamentosPeriodo(ym, ym)) for (const d of l.diasLista) s.add(d);
    return s.size;

}
function docMes(ym) { return S.meses.get(chaveYM(ym)) || null; }
function diasOperacao(ym) {
  const m = docMes(ym);
  if (m && ok(Number(m.diasOperacao)) && Number(m.diasOperacao) > 0) return Number(m.diasOperacao);

}
function ymInicioRotas() {
  const s = P().inicioRotasExternas;

}
function escopoPadrao(ym) {
  const ini = ymInicioRotas();
  if (ini == null || ym < ini) return 'Lojas Simão';
  if (ym === ini) return `Lojas Simão + rotas externas a partir de ${dataCurta(P().inicioRotasExternas)}`;
  return 'Lojas Simão + rotas externas';
}
function infoMes(ym) {
  const m = docMes(ym) || {};
  return {
    ym,
    existe: !!docMes(ym),
    escopo: m.escopoColeta || escopoPadrao(ym),
    quebraSerie: typeof m.quebraSerie === 'boolean' ? m.quebraSerie : ym === ymInicioRotas(),
    situacao: m.situacao === 'fechado' ? 'fechado' : 'aberto',
    diasOperacao: diasOperacao(ym),

    observacao: m.observacao || '',
    dataInicioRotasExternas: m.dataInicioRotasExternas || null

}
function mesFechado(ym) { return infoMes(ym).situacao === 'fechado'; }
function comparacaoAfetada(ymA, ymB) {
  if (ymA == null || ymB == null) return false;
  const a = Math.min(ymA, ymB), b = Math.max(ymA, ymB);
  for (let y = a; y <= b; y++) if (y !== a && infoMes(y).quebraSerie) return true;
  return infoMes(ymA).escopo !== infoMes(ymB).escopo;
}
function quebrasNoIntervalo(ini, fim) {
  const r = [];
  for (let y = ini; y <= fim; y++) if (infoMes(y).quebraSerie) r.push(y);
  return r;
}
function diasOperacaoPeriodo(ini, fim) {
  let t = 0;
  for (const y of mesesComDados()) if (y >= ini && y <= fim) t += diasOperacao(y) || 0;
  return t;
}

/* ---------- agregação e indicadores ---------- */
function agregar(lancs) {
  const ag = { linhas: 0, dias: 0, pedidos: 0, nfs: 0, documentos: 0, skus: 0, unidades: 0, espItens: 0, espUnid: 0, espDocs: 0, semMeta: false, meses: new Set(), metasUsadas: new Set() };
  for (const l of lancs) {
    ag.linhas++;
    ag.dias += l.diasFuncao; ag.pedidos += l.pedidos; ag.nfs += l.nfs; ag.documentos += l.documentos;
    ag.skus += l.skus; ag.unidades += l.unidades;
    ag.meses.add(l.ym);
    const m = metaVigente(l.funcao, l.ym);
    if (m && m.itensDia > 0 && m.unidadesDia > 0) {
      ag.espItens += l.diasFuncao * m.itensDia;
      ag.espUnid += l.diasFuncao * m.unidadesDia;
      ag.espDocs += l.diasFuncao * (m.documentosDia || 0);
      ag.metasUsadas.add(m.id);
    } else ag.semMeta = true;
  }
  return ag;
}
/* % da meta = Σ realizado ÷ Σ (dias × meta vigente no mês). Com uma só meta no período,
   é exatamente (itens/dia) ÷ meta. Nunca média de percentuais mensais. */
function indicadores(ag, { equipe = false } = {}) {
  const p = P();
  const r = {
    itensDia: div(ag.skus, ag.dias), unidDia: div(ag.unidades, ag.dias), docsDia: div(ag.documentos, ag.dias),
    itensPorDoc: div(ag.skus, ag.documentos), unidPorItem: div(ag.unidades, ag.skus),
    metaItens: ag.semMeta ? null : div(ag.espItens, ag.dias),
    metaUnid: ag.semMeta ? null : div(ag.espUnid, ag.dias),
    metaDocs: ag.semMeta || !ag.espDocs ? null : div(ag.espDocs, ag.dias),
    pctItens: ag.semMeta ? null : div(ag.skus, ag.espItens),
    pctUnid: ag.semMeta ? null : div(ag.unidades, ag.espUnid),
    pctDocs: ag.semMeta || !ag.espDocs ? null : div(ag.documentos, ag.espDocs),
    elegivel: equipe ? ag.dias > 0 : ag.dias >= p.minimoDias,
    indice: null, situacao: null, motivo: ''
  };
  if (!r.elegivel) { r.situacao = 'insuf'; r.motivo = `${fInt(ag.dias)} ${ag.dias === 1 ? 'dia' : 'dias'} na função (mínimo ${p.minimoDias})`; }
  else if (r.pctItens == null || r.pctUnid == null) { r.situacao = 'semmeta'; r.motivo = 'Sem meta vigente cadastrada para o período'; }
  else {
    r.indice = r.pctItens * p.pesoItens + r.pctUnid * p.pesoQuantidade;
    r.situacao = r.indice >= 1 - EPS ? 'acima' : r.indice >= p.tolerancia - EPS ? 'na' : 'abaixo';
  }
  return r;
}
function linhasFuncao(ini, fim, funcao) {
  return memo(`lf|${ini}|${fim}|${funcao}`, () => {
    const grupos = new Map();
    for (const l of lancamentosPeriodo(ini, fim, funcao)) {
      if (!grupos.has(l.codigo)) grupos.set(l.codigo, []);
      grupos.get(l.codigo).push(l);
    }
    return [...grupos.entries()].map(([codigo, lancs]) => {
      const ag = agregar(lancs);
      const ind = indicadores(ag);
      const principal = funcaoPrincipalDe(codigo);
      const c = colab(codigo);
      return {
        codigo, funcao, lancs, ag, ind, principal,
        apoio: !!principal && principal !== funcao,
        nome: nomeExib(codigo), nomeCompleto: nomeCompleto(codigo),
        suspeito: lancs.some(l => l.suspeito),
        novo: ehNovato(codigo, fim),
        rotas: !!(c && c.rotasExternas),
        desligado: estaDesligado(codigo)
