    });
  });
}
function totaisFuncao(ini, fim, funcao) {
  return memo(`tf|${ini}|${fim}|${funcao}`, () => {
    const lancs = lancamentosPeriodo(ini, fim, funcao);
    const ag = agregar(lancs);
    const ind = indicadores(ag, { equipe: true });
    if (ind.pctItens != null && ind.pctUnid != null) {
      ind.indice = ind.pctItens * P().pesoItens + ind.pctUnid * P().pesoQuantidade;
    }
    const dOp = diasOperacaoPeriodo(ini, fim);
    return { ag, ind, colaboradores: new Set(lancs.map(l => l.codigo)).size, pessoasEq: div(ag.dias, dOp), diasOperacao: dOp };
  });
}
function totaisCD(ini, fim, funcaoFiltro) {
  return memo(`cd|${ini}|${fim}|${funcaoFiltro || ''}`, () => {
    const fs = funcaoFiltro ? [funcaoFiltro] : FUNCOES.map(f => f.id);
    const porFuncao = Object.fromEntries(fs.map(f => [f, totaisFuncao(ini, fim, f)]));
    const r = { porFuncao, documentos: 0, skus: 0, unidades: 0, dias: 0, linhas: 0 };
    let pesoIdx = 0, somaIdx = 0;
    for (const f of fs) {
      const t = porFuncao[f];
      r.documentos += t.ag.documentos; r.skus += t.ag.skus; r.unidades += t.ag.unidades; r.dias += t.ag.dias; r.linhas += t.ag.linhas;
      if (t.ind.indice != null) { somaIdx += t.ind.indice * t.ag.dias; pesoIdx += t.ag.dias; }
    }
    r.indice = div(somaIdx, pesoIdx);
    const lancs = fs.flatMap(f => lancamentosPeriodo(ini, fim, f));
    r.colaboradores = new Set(lancs.map(l => l.codigo)).size;
    return r;
  });
}

/* ---------- ranking ---------- */
function ranking(ini, fim, funcao, leitura) {
  return memo(`rk|${ini}|${fim}|${funcao}|${leitura}`, () => {
    const linhas = linhasFuncao(ini, fim, funcao);
    const base = leitura === 'principal' ? linhas.filter(r => !r.apoio) : linhas;
    const apoio = leitura === 'principal' ? linhas.filter(r => r.apoio) : [];
    const eleg = base.filter(r => r.ind.indice != null)
      .sort((a, b) => (b.ind.indice - a.ind.indice) || (b.ag.skus - a.ag.skus) || porCodigo(a.codigo, b.codigo));
    const pos = new Map(eleg.map((r, i) => [r.codigo, i + 1]));
    const nao = base.filter(r => r.ind.indice == null).sort((a, b) => (b.ag.dias - a.ag.dias) || (b.ag.skus - a.ag.skus));
    const apoioOrd = apoio.slice().sort((a, b) => ((b.ind.indice ?? -1) - (a.ind.indice ?? -1)) || (b.ag.skus - a.ag.skus));
    return { eleg, nao, apoio: apoioOrd, pos, linhas };
  });
}
function periodoAnterior(ini, fim, visao) {
  if (visao === 'acumulado') return fim - 1 >= ini ? [ini, fim - 1] : null;
  return [fim - 1, fim - 1];
}
function movimento(ini, fim, funcao, leitura, codigo, visao) {
  const ant = periodoAnterior(ini, fim, visao);
  if (!ant) return null;
  const atual = ranking(ini, fim, funcao, leitura).pos.get(codigo);
  if (atual == null) return null;
  if (!lancamentosPeriodo(ant[0], ant[1], funcao).length) return null;
  const antes = ranking(ant[0], ant[1], funcao, leitura).pos.get(codigo);
  if (antes == null) return { tipo: 'novo' };
  const d = antes - atual;
  return { tipo: d > 0 ? 'sobe' : d < 0 ? 'desce' : 'igual', d: Math.abs(d), anterior: antes };
}
function campeao(ym, funcao, leitura) {
  const rk = ranking(ym, ym, funcao, leitura);
  return rk.eleg[0] || null;
}
function primeirosEUltimos(rk, n = 3) {
  const e = rk.eleg;
  const topo = e.slice(0, n);
  const resto = e.slice(n);
  const fim = resto.slice(Math.max(0, resto.length - n));
  return { topo, fim };
}
function distribuicaoSituacao(ini, fim, funcao, leitura) {
  const rk = ranking(ini, fim, funcao, leitura);
  const d = { acima: [], na: [], abaixo: [], insuf: [], semmeta: [] };
  for (const r of [...rk.eleg, ...rk.nao]) d[r.ind.situacao].push(r);
  return d;

/* ---------- presença e multifunção ---------- */
function presenca(ym, codigo) {
  return memo(`pr|${ym}|${codigo}`, () => {
    const ls = lancamentosPeriodo(ym, ym).filter(l => l.codigo === String(codigo));
    const dias = new Set();
    const porFuncao = {};
    let df = 0;
    for (const l of ls) { l.diasLista.forEach(d => dias.add(d)); df += l.diasFuncao; porFuncao[l.funcao] = l.diasLista; }
    const dOp = diasOperacao(ym);
    return {
      ym, codigo: String(codigo), lancs: ls, funcoes: [...new Set(ls.map(l => l.funcao))],
      presenca: dias.size, diasFuncao: df, fatiamento: div(df, dias.size), alocacao: div(df, dOp), diasOperacao: dOp,
      dias: [...dias].sort((a, b) => a - b), porFuncao
    };
  });
}
function multifuncao(ini, fim) {
  return memo(`mf|${ini}|${fim}`, () => {
    const meses = mesesComDados().filter(y => y >= ini && y <= fim);
    const codigos = [...new Set(lancamentosPeriodo(ini, fim).map(l => l.codigo))].sort(porCodigo);
    const dOpTotal = diasOperacaoPeriodo(ini, fim);
    return codigos.map(codigo => {
      const porMes = meses.map(y => presenca(y, codigo));
      const pres = soma(porMes, m => m.presenca), df = soma(porMes, m => m.diasFuncao);
      const funcoes = new Set(); porMes.forEach(m => m.funcoes.forEach(f => funcoes.add(f)));
      return {
        codigo, nome: nomeExib(codigo), principal: funcaoPrincipalDe(codigo), porMes, meses,
        presenca: pres, diasFuncao: df, fatiamento: div(df, pres), alocacao: div(df, dOpTotal),
        funcoes: [...funcoes], maxFuncoesMes: Math.max(0, ...porMes.map(m => m.funcoes.length)),
        mesesFatiados: porMes.filter(m => m.diasFuncao > m.presenca).length

    });
  });
}

/* ---------- operação (visão do CEO) ---------- */
function concentracao(ini, fim, funcao) {
  return memo(`cc|${ini}|${fim}|${funcao}`, () => {
    const linhas = linhasFuncao(ini, fim, funcao);
    const total = soma(linhas, r => r.ag.skus);
    if (!total) return null;
    const ord = linhas.slice().sort((a, b) => b.ag.skus - a.ag.skus);
    const topo = ord[0];
    return { codigo: topo.codigo, nome: topo.nome, share: topo.ag.skus / total, itens: topo.ag.skus, total, ordenado: ord.map(r => ({ codigo: r.codigo, nome: r.nome, itens: r.ag.skus, share: r.ag.skus / total, apoio: r.apoio })) };
  });
}
/* Capacidade potencial: para cada elegível com índice abaixo de 100%, os dias que bastariam
   para o mesmo volume se estivesse na meta = dias × índice. A diferença é liberável. */
function capacidade(ini, fim, funcao) {
  return memo(`cap|${ini}|${fim}|${funcao}`, () => {
    const dOp = diasOperacaoPeriodo(ini, fim);
    const det = linhasFuncao(ini, fim, funcao)
      .filter(r => r.ind.indice != null && r.ind.indice < 1 - EPS)
      .map(r => ({
        codigo: r.codigo, nome: r.nome, dias: r.ag.dias, indice: r.ind.indice, situacao: r.ind.situacao, apoio: r.apoio,
        necessarios: r.ag.dias * r.ind.indice, liberaveis: r.ag.dias * (1 - r.ind.indice)
      }))
      .sort((a, b) => b.liberaveis - a.liberaveis);
    const dias = soma(det, d => d.liberaveis);
    const diasAbaixo = soma(det.filter(d => d.situacao === 'abaixo'), d => d.liberaveis);

function operacao(ini, fim) {
  return memo(`op|${ini}|${fim}`, () => {

    const rec = t.recebimento.ag, sep = t.separacao.ag, exp = t.expedicao.ag;
    const dOp = diasOperacaoPeriodo(ini, fim);
    return {
      t, diasOperacao: dOp,
      coberturaItens: sep.skus ? div(exp.skus, sep.skus) : null,
      coberturaPedidos: sep.pedidos ? div(exp.pedidos, sep.pedidos) : null,
      relacaoMO: exp.dias ? div(sep.dias, exp.dias) : null,
      saldo: (rec.linhas && sep.linhas) ? rec.unidades - sep.unidades : null,
      pessoasEq: Object.fromEntries(FUNCOES.map(f => [f.id, div(t[f.id].ag.dias, dOp)])),
      pessoasEqTotal: div(rec.dias + sep.dias + exp.dias, dOp),
      produtividade: Object.fromEntries(FUNCOES.map(f => [f.id, t[f.id].ind.itensDia])),
      concentracao: Object.fromEntries(FUNCOES.map(f => [f.id, concentracao(ini, fim, f.id)])),

}
function saldoAcumulado(ate) {
  let s = 0;
  for (const y of mesesComDados()) {
    if (y > ate || anoDe(y) !== anoDe(ate)) continue;
    const op = operacao(y, y);
    if (op.saldo != null) s += op.saldo;
  }
  return s;
}

/* ---------- duplicidades (achado A1) ---------- */
function duplicidades(ym) {
  return memo('dup|' + ym, () => {
    const ls = lancamentosPeriodo(ym, ym);
    const r = [];
    for (let i = 0; i < ls.length; i++) for (let j = i + 1; j < ls.length; j++) {
      const a = ls[i], b = ls[j];
      if (a.codigo === b.codigo && a.funcao !== b.funcao && a.diasFuncao === b.diasFuncao && a.pedidos === b.pedidos && a.nfs === b.nfs && a.skus === b.skus && a.unidades === b.unidades && iguais(a.diasLista, b.diasLista)) r.push([a, b]);
    }
    return r;
  });
}

/* ---------- alertas automáticos ---------- */
function alertasDoMes(ym) {
  return memo('al|' + ym, () => {

    const lista = [];

    const afetada = comparacaoAfetada(ym, ant);

    for (const f of FUNCOES) {

      const antes = new Map(linhasFuncao(ant, ant, f.id).map(r => [r.codigo, r]));
      const eleg = linhas.filter(r => r.ind.indice != null);

      for (const r of eleg) {

        }

              texto: `De ${fPct(a.ind.indice)} para ${fPct(r.ind.indice)} contra o mês anterior (limite de queda: ${fPct(p.limiteQueda)}).${afetada ? ' Comparação afetada pela quebra de série do escopo da coleta.' : ''}` });
          }
        }

            titulo: `${r.nome}: ${fD1(r.ind.itensDia)} itens/dia em ${f.nome}, mais que o dobro da mediana`,
            texto: `Mediana da função no mês: ${fD1(med)} itens/dia. Verificar login compartilhado no coletor antes de usar o número como referência.` });
        }
      }
      const c = concentracao(ym, ym, f.id);
      if (c && c.share > p.limiteConcentracao + EPS) {
        add({ tipo: 'concentracao', gravidade: 'media', codigo: c.codigo, funcao: f.id,
          titulo: `${c.nome} concentrou ${fPct(c.share)} dos itens ${f.verboItens}`,
          texto: `Limite de concentração: ${fPct(p.limiteConcentracao)}. Risco de dependência: se ele faltar, a função perde ${fPct(c.share)} do volume. Avaliar formação de substituto.` });
      }

    const codigos = [...new Set(lancamentosPeriodo(ym, ym).map(l => l.codigo))];

          texto: `Atuou em ${pr.funcoes.length} funções no mesmo período (índice de fatiamento ${fD2(pr.fatiamento)}). A produtividade por dia em cada função fica subestimada.` });
      }

      }
      if (estaDesligado(codigo, ym)) {

        texto: `${a.diasFuncao} dias, ${fInt(a.pedidos + a.nfs)} documentos, ${fInt(a.skus)} itens e ${fInt(a.unidades)} unidades nas duas funções, com a mesma lista de dias. Provável lançamento em dobro: confirme com o suporte Kaizen e exclua um dos dois.`,
        ids: [a.id, b.id] });
    }
    const ordem = { alta: 0, media: 1, info: 2 };
    lista.sort((x, y) => ordem[x.gravidade] - ordem[y.gravidade]);
    lista.temAnterior = temAnt;
    return lista;
  });
}

/* ---------- metas sugeridas (P75) ---------- */
function sugerirMetas(ini, fim, minDias) {
  return FUNCOES.map(f => {
    const ls = lancamentosPeriodo(ini, fim, f.id).filter(l => l.diasFuncao >= minDias);
    const it = ls.map(l => l.skus / l.diasFuncao), un = ls.map(l => l.unidades / l.diasFuncao), dc = ls.map(l => l.documentos / l.diasFuncao);
    return { funcao: f.id, n: ls.length, itensDia: percentilInc(it, 0.75), unidadesDia: percentilInc(un, 0.75), documentosDia: percentilInc(dc, 0.75) };
  });
}

/* ---------- validação de um lançamento ---------- */
function validarLancamento(l) {
  const erros = [], alertas = [];
  if (!Number.isInteger(l.ano) || l.ano < 2000 || l.ano > 2100) erros.push('Ano inválido.');
  if (!Number.isInteger(l.mes) || l.mes < 1 || l.mes > 12) erros.push('Mês inválido.');
  if (!FUNC[l.funcao]) erros.push('Função desconhecida.');
  if (!String(l.codigo || '').trim()) erros.push('Código do colaborador em branco.');
  if (!ok(l.diasFuncao) || l.diasFuncao <= 0) erros.push('Dias na função zerados.');
  else if (!Number.isInteger(l.diasFuncao)) erros.push('Dias na função precisa ser um número inteiro.');
  for (const k of ['pedidos', 'nfs', 'skus', 'unidades']) if (!ok(l[k]) || l[k] < 0) erros.push(`Valor inválido em ${k === 'skus' ? 'itens' : k === 'nfs' ? 'NF' : k}.`);
  if (Number.isInteger(l.ano) && Number.isInteger(l.mes) && l.mes >= 1 && l.mes <= 12) {
    const max = diasNoMes(l.ano, l.mes);
    const ruins = (l.diasLista || []).filter(d => !Number.isInteger(d) || d < 1 || d > max);
    if (ruins.length) erros.push(`Dias fora do calendário do mês: ${ruins.join(', ')}.`);
    if (new Set(l.diasLista || []).size !== (l.diasLista || []).length) alertas.push('Há dias repetidos na lista de dias.');
  }
  if ((l.diasLista || []).length && ok(l.diasFuncao) && l.diasLista.length !== l.diasFuncao) alertas.push(`A lista tem ${l.diasLista.length} dias, mas "dias na função" é ${l.diasFuncao}.`);
  if (!(l.diasLista || []).length) alertas.push('Sem lista de dias: presença e calendário ficam incompletos.');
  if (l.funcao === 'recebimento' && l.pedidos > 0) alertas.push('Recebimento com pedidos (OM): normalmente é zero.');
  if (l.funcao && l.funcao !== 'recebimento' && l.nfs > 0) alertas.push('NF conferidas fora do recebimento: normalmente é zero.');
  if (l.skus === 0) alertas.push('Itens (SKU) zerados.');
  return { erros, alertas };
}
function parseDias(v) {
  if (v === null || v === undefined || v === '') return [];
  if (typeof v === 'number') return Number.isInteger(v) ? [v] : [];
  return (String(v).match(/\d+/g) || []).map(Number);
}

/* ---------- auditoria ---------- */
function auditoria(ano) {
  return memo('aud|' + ano, () => {
    const ini = ymDe(ano, 1), fim = ymDe(ano, 12);
    const ls = lancamentosPeriodo(ini, fim);
    const meses = mesesComDados().filter(y => anoDe(y) === ano);
    const amarracao = FUNCOES.map(f => {
      const base = { dias: 0, itens: 0, unidades: 0 };
      for (const l of ls) if (l.funcao === f.id) { base.dias += l.diasFuncao; base.itens += l.skus; base.unidades += l.unidades; }
      const mensal = { dias: 0, itens: 0, unidades: 0 };
      for (const y of meses) { const t = totaisFuncao(y, y, f.id).ag; mensal.dias += t.dias; mensal.itens += t.skus; mensal.unidades += t.unidades; }
      const acum = { dias: 0, itens: 0, unidades: 0 };
      for (const r of linhasFuncao(ini, fim, f.id)) { acum.dias += r.ag.dias; acum.itens += r.ag.skus; acum.unidades += r.ag.unidades; }
      // soma das diferenças absolutas: uma sobra num lado não pode esconder uma falta no outro
      const dif = k => arred(Math.abs(base[k] - mensal[k]) + Math.abs(base[k] - acum[k]), 2);
      return { funcao: f.id, base, mensal, acum, dif: { dias: dif('dias'), itens: dif('itens'), unidades: dif('unidades') } };
    });
    const totais = [];
    for (const y of meses) for (const f of FUNCOES) {
      const t = totaisFuncao(y, y, f.id).ag;
      if (t.linhas) totais.push({ ym: y, funcao: f.id, linhas: t.linhas, dias: t.dias, documentos: t.documentos, itens: t.skus, unidades: t.unidades });
    }
    const problemas = [];
    const addP = (tipo, texto, acao, params, gravidade = 'media') => problemas.push({ tipo, texto, acao, params, gravidade });
    for (const l of ls) {
      if (l.diasLista.length && l.diasLista.length !== l.diasFuncao) addP('Lista de dias', `${nomeExib(l.codigo)} · ${FUNC[l.funcao]?.nome} · ${rotuloYM(l.ym)}: lista com ${l.diasLista.length} dias e ${l.diasFuncao} dias na função.`, 'lancamento', { id: l.id });
      if (l.diasFuncao <= 0) addP('Dias zerados', `${nomeExib(l.codigo)} · ${FUNC[l.funcao]?.nome} · ${rotuloYM(l.ym)}: lançamento sem dias.`, 'lancamento', { id: l.id }, 'alta');
      if (!FUNC[l.funcao]) addP('Função desconhecida', `Lançamento ${l.id} com função "${l.funcao}".`, 'lancamento', { id: l.id }, 'alta');
      if (!colab(l.codigo)) addP('Sem cadastro', `Código ${l.codigo} tem lançamento em ${rotuloYM(l.ym)} mas não está no cadastro de colaboradores.`, 'colaboradores', {}, 'alta');
    }
    for (const y of meses) {
      for (const [a, b] of duplicidades(y)) addP('Duplicidade', `${nomeExib(a.codigo)} · ${rotuloYM(y)}: lançamentos idênticos em ${FUNC[a.funcao].nome} e ${FUNC[b.funcao].nome}.`, 'lancamento', { id: a.id }, 'alta');
      if (!infoMes(y).existe || !infoMes(y).diasOperacaoGravado) addP('Dias de operação', `${rotuloYM(y)}: dias de operação não gravados (usando o calculado: ${fInt(diasOperacaoCalculado(y))}).`, 'parametros', { aba: 'meses' }, 'info');
    }
    for (const c of S.colaboradores.values()) {
      if (c.revisar) addP('Revisar cadastro', `${nomeExib(c.codigo)} (${c.codigo}): ${semPonto(c.motivoRevisao || 'função principal a confirmar')}.`, 'colaboradores', {}, 'info');
    }
    const fatiados = [];
    for (const y of meses) for (const codigo of new Set(lancamentosPeriodo(y, y).map(l => l.codigo))) {
      const pr = presenca(y, codigo);
      if (pr.diasFuncao > pr.presenca) fatiados.push(pr);
    }
    const fracionadas = ls.filter(l => Math.abs(l.unidades - Math.round(l.unidades)) > 1e-9);
    const comMedia = ls.filter(l => ok(Number(l.mediaKaizen)) && l.diasFuncao > 0);
    const truncada = comMedia.filter(l => Number(l.mediaKaizen) === Math.floor(l.skus / l.diasFuncao)).length;
    const arredondada = comMedia.filter(l => Number(l.mediaKaizen) !== Math.floor(l.skus / l.diasFuncao) && Number(l.mediaKaizen) === Math.round(l.skus / l.diasFuncao)).length;
    const comPeso = ls.filter(l => l.pesoBruto !== null && l.pesoBruto !== undefined && l.pesoBruto !== '');
    const pesoIgual = comPeso.filter(l => Math.abs(Number(l.pesoBruto) - l.unidades) < 0.006).length;
    const comVol = ls.filter(l => l.volumeBruto !== null && l.volumeBruto !== undefined && l.volumeBruto !== '');
    const volIgual = comVol.filter(l => Math.abs(Number(l.volumeBruto) - l.unidades / 10000) < 0.0051).length;
    return { ano, meses, amarracao, totais, problemas, fatiados, fracionadas, comMedia: comMedia.length, truncada, arredondada, comPeso: comPeso.length, pesoIgual, comVol: comVol.length, volIgual, linhas: ls.length };
  });
}

/* ---------- leitura gerencial automática ---------- */
function leituraGerencial(ini, fim, funcaoFiltro, leitura, visao) {
  const frases = [];
  const per = rotuloPeriodo(ini, fim);
  const perMin = ini === fim ? `em ${rotuloYM(fim).toLowerCase()}` : `em ${per}`;
  const fs = funcaoFiltro ? [FUNC[funcaoFiltro]] : FUNCOES;
  const p = P();
  const op = operacao(ini, fim);
  const quebras = quebrasNoIntervalo(visao === 'acumulado' ? ini : fim, fim);
  if (quebras.length) {
    const y = quebras[quebras.length - 1];
    const im = infoMes(y);
    frases.push({ tom: 'atencao', icone: 'atencao', acao: 'parametros', params: { aba: 'meses' },
      html: `<b>Quebra de série em ${esc(rotuloYM(y).toLowerCase())}</b>: o escopo da coleta passou a ser "${esc(im.escopo)}". O aumento de volume vem da entrada de uma operação que antes não era medida, não de ganho de produtividade.` });
  } else if (visao !== 'acumulado' && lancamentosPeriodo(fim - 1, fim - 1).length && comparacaoAfetada(fim, fim - 1)) {
    frases.push({ tom: 'atencao', icone: 'atencao', acao: 'parametros', params: { aba: 'meses' },
      html: `<b>O escopo da coleta mudou</b> de "${esc(infoMes(fim - 1).escopo)}" para "${esc(infoMes(fim).escopo)}": comparações com ${esc(rotuloYM(fim - 1).toLowerCase())} ficam afetadas.` });
  }
  for (const f of fs) {
    const c = op.concentracao[f.id];
    if (c && c.share > p.limiteConcentracao + EPS) {
      frases.push({ tom: 'alerta', icone: 'atencao', acao: 'funcao', params: { f: f.id },
        html: `<b>${esc(c.nome)}</b> concentrou <b>${fPct(c.share)}</b> dos itens ${esc(f.verboItens)} ${esc(perMin)}. Risco de dependência.` });
    }

  if (ini === fim) {
    for (const a of alertasDoMes(fim).filter(a => a.tipo === 'login' && (!funcaoFiltro || a.funcao === funcaoFiltro)).slice(0, 2)) {
      frases.push({ tom: 'atencao', icone: 'lupa', acao: 'ficha', params: { codigo: a.codigo, ym: fim, f: a.funcao },
        html: `<b>${esc(a.titulo)}</b>. Verificar login compartilhado no coletor.` });
    }
  }
  if (!funcaoFiltro || funcaoFiltro === 'expedicao' || funcaoFiltro === 'separacao') {
    if (op.coberturaItens != null) {
      const cob = op.coberturaItens;
      frases.push({ tom: Math.abs(1 - cob) <= 0.02 ? 'bom' : 'atencao', icone: Math.abs(1 - cob) <= 0.02 ? 'certo' : 'atencao', acao: 'fluxo', params: {},
        html: `A conferência de expedição cobriu <b>${fPct1(cob)}</b> dos itens separados${op.coberturaPedidos != null ? ` e <b>${fPct1(op.coberturaPedidos)}</b> dos pedidos` : ''} ${esc(perMin)}.` });
    }
    if (op.relacaoMO != null) {
      frases.push({ tom: 'info', icone: 'multifuncao', acao: 'fluxo', params: {},
        html: `A separação consumiu <b>${fD1(op.relacaoMO)} dias-função</b> para cada dia de conferência de expedição.` });
    }
  }
  if (op.saldo != null && (!funcaoFiltro || funcaoFiltro !== 'expedicao')) {
    frases.push({ tom: 'info', icone: 'fluxo', acao: 'fluxo', params: {},
      html: op.saldo >= 0
        ? `Saldo de fluxo ${esc(perMin)}: entraram <b>${fInt(op.saldo)} unidades a mais</b> do que foram separadas.`
        : `Saldo de fluxo ${esc(perMin)}: foram separadas <b>${fInt(-op.saldo)} unidades a mais</b> do que entraram.` });
  }
  let nAbaixo = 0, nAcima = 0, nEleg = 0;
  for (const f of fs) { const d = distribuicaoSituacao(ini, fim, f.id, leitura); nAbaixo += d.abaixo.length; nAcima += d.acima.length; nEleg += d.acima.length + d.na.length + d.abaixo.length; }
  if (nEleg) {
    frases.push({ tom: nAbaixo > nEleg / 2 ? 'alerta' : 'info', icone: 'ranking', acao: 'rankings', params: { aba: visao === 'acumulado' ? 'acumulado' : 'mensal' },
      html: `<b>${nAbaixo} de ${nEleg}</b> avaliações elegíveis ficaram abaixo da meta e <b>${nAcima}</b> acima ${esc(perMin)} (leitura: ${leitura === 'principal' ? 'função principal' : 'todos os lançamentos'}).` });
  }
  if (ini === fim) {
    const abaixo2 = alertasDoMes(fim).filter(a => a.tipo === 'abaixo2' && (!funcaoFiltro || a.funcao === funcaoFiltro));
    if (abaixo2.length) {
      frases.push({ tom: 'alerta', icone: 'desce', acao: 'alertas', params: { aba: 'alertas' },
        html: `<b>${abaixo2.length} ${abaixo2.length === 1 ? 'colaborador está' : 'colaboradores estão'}</b> abaixo da meta pelo 2º mês seguido: ${esc(abaixo2.map(a => nomeExib(a.codigo)).filter((v, i, arr) => arr.indexOf(v) === i).join(', '))}.` });

  }
  const mf = multifuncao(ini, fim).filter(m => m.diasFuncao > m.presenca).sort((a, b) => (b.diasFuncao - b.presenca) - (a.diasFuncao - a.presenca));
  if (mf.length) {
    const m = mf[0];
    frases.push({ tom: 'atencao', icone: 'multifuncao', acao: 'multifuncao', params: {},
      html: `<b>${esc(m.nome)}</b> somou <b>${fInt(m.diasFuncao)} dias-função em ${fInt(m.presenca)} dias de presença</b> (${m.funcoes.length} funções). A produtividade por dia dele está subestimada; leia Multifunção antes de cobrar.` });
  }
  let capDias = 0, capDiasAbaixo = 0;
  for (const f of fs) { capDias += op.capacidade[f.id].dias; capDiasAbaixo += op.capacidade[f.id].diasAbaixo; }
  if (capDias > 0 && op.diasOperacao) {
    frases.push({ tom: 'info', icone: 'fluxo', acao: 'fluxo', params: {},
      html: `Capacidade potencial: se os elegíveis abaixo de 100% chegassem à meta, seriam liberados <b>${fD1(capDias)} dias-função</b> (≈ ${fD1(capDias / op.diasOperacao)} pessoas-equivalentes); só os "abaixo da meta" somam ${fD1(capDiasAbaixo)}. Não considera qualidade nem função de apoio.` });
  }
  const ant = periodoAnterior(ini, fim, visao);
  if (ant && lancamentosPeriodo(ant[0], ant[1]).length) {
    let maior = null;
    for (const f of fs) {
      const a = totaisFuncao(ant[0], ant[1], f.id).ind.itensDia, b = totaisFuncao(ini, fim, f.id).ind.itensDia;
      if (a && b) { const v = b / a - 1; if (!maior || Math.abs(v) > Math.abs(maior.v)) maior = { f, v, b }; }
    }
    if (maior) {
      const afet = comparacaoAfetada(fim, ant[1]);
      frases.push({ tom: afet ? 'atencao' : (maior.v >= 0 ? 'bom' : 'atencao'), icone: maior.v >= 0 ? 'sobe' : 'desce', acao: 'funcao', params: { f: maior.f.id },
        html: `A produtividade da equipe de ${esc(maior.f.nome.toLowerCase())} foi de <b>${fD1(maior.b)} itens/dia</b> (${fSinal(maior.v * 100, 'int')}% contra ${visao === 'acumulado' ? 'o acumulado até o mês anterior' : esc(rotuloYM(ant[1]).toLowerCase())})${afet ? '; comparação afetada pela quebra de série' : ''}.` });
    }
  }
  return frases;
}

/* ---------- diálogos (nunca janelas nativas) ---------- */
let modalAtual = null;
function abrirModal({ titulo, corpo, botoes = [], largo = false, aoMontar, fecharFora = true }) {
  fecharModal();
  const raiz = document.createElement('div');
  raiz.className = 'modal-fundo';
  raiz.innerHTML = `<div class="modal${largo ? ' largo' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="cab-modal"><h3 id="modal-titulo">${esc(titulo)}</h3><button type="button" class="btn fantasma btn-icone" data-modal-fechar aria-label="Fechar">${icone('fechar')}</button></div>
    <div class="corpo-modal">${corpo}</div>
    ${botoes.length ? `<div class="pe-modal">${botoes.map((b, i) => `<button type="button" class="btn ${b.classe || ''}" data-modal-botao="${i}"${b.desab ? ' disabled' : ''}>${b.ic ? icone(b.ic) : ''}<span>${esc(b.rotulo)}</span></button>`).join('')}</div>` : ''}
  </div>`;
  document.body.appendChild(raiz);
  const anterior = document.activeElement;
  const ctrl = {
    el: raiz,
    fechar() {
      if (!raiz.isConnected) return;
      raiz.remove();
      if (modalAtual === ctrl) modalAtual = null;
      if (anterior && anterior.focus && document.contains(anterior)) { try { anterior.focus(); } catch (e) { /* sem foco */ } }
    },
    ocupado(sim) { $$('.pe-modal button, [data-modal-fechar]', raiz).forEach(b => { b.disabled = !!sim; }); }
  };
  raiz.addEventListener('click', async ev => {
    if (ev.target === raiz && fecharFora) { ctrl.fechar(); return; }
    if (ev.target.closest('[data-modal-fechar]')) { ctrl.fechar(); return; }
    const b = ev.target.closest('[data-modal-botao]');
    if (b) {
      const def = botoes[+b.dataset.modalBotao];
      if (!def) return;
      if (def.acao) {
        const r = await def.acao(ctrl);
        if (r === false) return;
      }
      if (def.fechar !== false) ctrl.fechar();
    }
  });
  raiz.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { ev.stopPropagation(); ctrl.fechar(); }
    if (ev.key === 'Tab') {
      const foco = $$('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex="0"]', raiz).filter(e => e.offsetParent !== null);
      if (!foco.length) return;
      const pri = foco[0], ult = foco[foco.length - 1];
      if (ev.shiftKey && document.activeElement === pri) { ev.preventDefault(); ult.focus(); }
      else if (!ev.shiftKey && document.activeElement === ult) { ev.preventDefault(); pri.focus(); }
    }
  });
  modalAtual = ctrl;
  if (aoMontar) aoMontar(raiz, ctrl);
  setTimeout(() => {
    const alvo = $('[autofocus]', raiz) || $('.corpo-modal input, .corpo-modal select, .corpo-modal textarea', raiz) || $('.pe-modal .btn.primario', raiz) || $('[data-modal-fechar]', raiz);
    if (alvo) try { alvo.focus(); } catch (e) { /* sem foco */ }
  }, 30);
  return ctrl;
}
function fecharModal() { if (modalAtual) modalAtual.fechar(); }
function confirmar({ titulo, texto, rotuloOk = 'Confirmar', perigo = false, rotuloCancelar = 'Cancelar' }) {
  return new Promise(resolve => {
    let resposta = false;
    const ctrl = abrirModal({
      titulo,
      corpo: `<div class="texto">${texto}</div>`,
      botoes: [
        { rotulo: rotuloCancelar, classe: 'fantasma', acao: () => { resposta = false; } },
        { rotulo: rotuloOk, classe: perigo ? 'perigo cheio' : 'primario', acao: () => { resposta = true; } }
      ]
    });
    const obs = new MutationObserver(() => { if (!ctrl.el.isConnected) { obs.disconnect(); resolve(resposta); } });
    obs.observe(document.body, { childList: true });
  });
}

/* ---------- dicas (passar o mouse ou focar) ---------- */
function iniciarDicas() {
  let dica = null, alvo = null;
  const mostrar = el => {
    const txt = el.getAttribute('data-dica');
    if (!txt) return;
    alvo = el;
    if (!dica) { dica = document.createElement('div'); dica.className = 'dica-flutuante'; dica.setAttribute('role', 'tooltip'); document.body.appendChild(dica); }
    dica.textContent = txt;
    dica.hidden = false;
    const r = el.getBoundingClientRect();
    const d = dica.getBoundingClientRect();
    let x = r.left + r.width / 2 - d.width / 2;
    x = Math.max(8, Math.min(x, window.innerWidth - d.width - 8));
    let y = r.top - d.height - 8;
    if (y < 8) y = r.bottom + 8;
    dica.style.left = x + 'px';
    dica.style.top = y + 'px';
  };
  const esconder = () => { alvo = null; if (dica) dica.hidden = true; };
  document.addEventListener('mouseover', ev => {
    const el = ev.target.closest && ev.target.closest('[data-dica]');
    if (el && el !== alvo) mostrar(el);
    if (!el && alvo) esconder();
  });
  document.addEventListener('focusin', ev => { const el = ev.target.closest && ev.target.closest('[data-dica]'); if (el) mostrar(el); });
  document.addEventListener('focusout', esconder);
  document.addEventListener('scroll', esconder, true);
  document.addEventListener('touchstart', esconder, { passive: true });
}

function lerCampo(raiz, id) { const el = $(`#${CSS.escape(id)}`, raiz); return el ? el.value : ''; }
function lerNumero(raiz, id) {
  const t = String(lerCampo(raiz, id)).trim();

  return numeroTexto(t);
}
function marcarErro(raiz, id, msg) {

/* número digitado ou lido de planilha: aceita 1.234,5 / 1234.5 / "183046.67kg" */
function numeroTexto(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  let s = String(v).trim().replace(/\s+/g, '').replace(/(kg|m³|m3|und|un)$/i, '');
  if (s === '' || s === '-') return null;
  const temV = s.includes(','), temP = s.includes('.');
  if (temV && temP) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (temV) {
    s = s.replace(',', '.');
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

const GRAF = { instancias: [], pendentes: [] };
const PALETA_CLARA = {

function token(nome) { return getComputedStyle(document.documentElement).getPropertyValue(nome).trim(); }

  return {
    texto: token('--text'), texto2: token('--text-2'), fraco: token('--muted'), grade: token('--grid'), eixo: token('--axis'), superficie: token('--surface'),
    simao: token('--simao'), bordo: token('--bordo'), ok: token('--ok'), warn: token('--warn'), bad: token('--bad'), na: token('--na'),
    funcao: { recebimento: token('--f-rec'), separacao: token('--f-sep'), expedicao: token('--f-exp') }

function comAlfa(hex, a) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}
const reduzMovimento = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- plugins ---------- */
const pluginLinhaMeta = {
  id: 'linhaMeta',
  beforeDatasetsDraw(chart, args, o) {
    if (!o || !ok(o.valor) || !ok(o.tolerancia)) return;
    const { ctx, chartArea: a } = chart;
    const esc = chart.scales[o.eixo === 'x' ? 'x' : 'y'];
    if (!esc) return;
    const p1 = esc.getPixelForValue(o.valor * o.tolerancia), p2 = esc.getPixelForValue(o.valor);
    ctx.save();
    ctx.fillStyle = o.corFaixa || 'rgba(224,161,0,.14)';
    if (o.eixo === 'x') ctx.fillRect(Math.min(p1, p2), a.top, Math.abs(p2 - p1), a.bottom - a.top);
    else ctx.fillRect(a.left, Math.min(p1, p2), a.right - a.left, Math.abs(p2 - p1));
    ctx.restore();
  },
  afterDatasetsDraw(chart, args, o) {
    if (!o || !ok(o.valor)) return;
    const { ctx, chartArea: a } = chart;
    const esc = chart.scales[o.eixo === 'x' ? 'x' : 'y'];
    if (!esc) return;
    const p = esc.getPixelForValue(o.valor);
    ctx.save();
    ctx.strokeStyle = o.cor || '#2B2321';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (o.eixo === 'x') { ctx.moveTo(p, a.top); ctx.lineTo(p, a.bottom); }
    else { ctx.moveTo(a.left, p); ctx.lineTo(a.right, p); }
    ctx.stroke();
    if (o.rotulo) {
      ctx.fillStyle = o.cor || '#2B2321';
      ctx.font = `700 11px ${getComputedStyle(document.body).fontFamily || 'sans-serif'}`;
      if (o.eixo === 'x') {
        const larg = ctx.measureText(o.rotulo).width;
        const esquerda = p + 5 + larg > a.right;
        ctx.textAlign = esquerda ? 'right' : 'left';
        ctx.fillText(o.rotulo, p + (esquerda ? -5 : 5), o.posRotulo === 'topo' ? a.top + 11 : a.bottom - 6);
      }
      else { ctx.textAlign = 'right'; ctx.fillText(o.rotulo, a.right - 4, p - 5); }
    }
    ctx.restore();
  }
};
const pluginQuebra = {
  id: 'quebraSerie',
  afterDatasetsDraw(chart, args, o) {
    if (!o || !Array.isArray(o.indices) || !o.indices.length) return;
    const { ctx, chartArea: a } = chart;
    const x = chart.scales.x;
    if (!x) return;
    ctx.save();
    for (const i of o.indices) {
      if (i < 0) continue;
      const px = i > 0 ? (x.getPixelForValue(i - 1) + x.getPixelForValue(i)) / 2 : x.getPixelForValue(i) - 8;
      ctx.strokeStyle = o.cor || '#E0A100';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = o.corTexto || '#6E6360';
      ctx.font = `500 10.5px ${getComputedStyle(document.body).fontFamily || 'sans-serif'}`;
      const rot = o.rotulo || 'Quebra de série';
      const cabe = px + 4 + ctx.measureText(rot).width <= chart.width - 2;
      ctx.textAlign = cabe ? 'left' : 'right';
      ctx.fillText(rot, cabe ? px + 4 : px - 4, a.top + 10);
    }
    ctx.restore();
  }
};
const pluginRotulos = {
  id: 'rotulosPontos',
  afterDatasetsDraw(chart, args, o) {
    if (!o || !o.rotulos) return;
    const { ctx } = chart;
    ctx.save();
    ctx.font = `500 11px ${getComputedStyle(document.body).fontFamily || 'sans-serif'}`;
    ctx.fillStyle = o.cor || '#2B2321';
    ctx.textBaseline = 'middle';
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di);
      if (meta.hidden) return;
      meta.data.forEach((pt, i) => {
        const r = o.rotulos[di] && o.rotulos[di][i];
        if (!r) return;
        const x = pt.x + 8 + ctx.measureText(r).width > chart.chartArea.right ? pt.x - 8 : pt.x + 8;
        ctx.textAlign = x < pt.x ? 'right' : 'left';
        ctx.fillText(r, x, pt.y - 1);
      });
    });
    ctx.restore();
  }
};
const pluginFimBarra = {
  id: 'valorFimBarra',
  afterDatasetsDraw(chart, args, o) {
    if (!o || !o.formatar) return;
    const { ctx } = chart;
    ctx.save();
    ctx.font = `500 11px ${getComputedStyle(document.body).fontFamily || 'sans-serif'}`;
    ctx.fillStyle = o.cor || '#2B2321';
    ctx.textBaseline = 'middle';
    chart.data.datasets.forEach((ds, di) => {
      if (o.dataset !== undefined && o.dataset !== di) return;
      const meta = chart.getDatasetMeta(di);
      meta.data.forEach((el, i) => {
        const v = ds.data[i];
        if (v === null || v === undefined) return;
        const t = o.formatar(v, i);
        if (chart.options.indexAxis === 'y') { ctx.textAlign = 'left'; ctx.fillText(t, el.x + 6, el.y); }
        else { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(t, el.x, el.y - 4); }
      });
    });
    ctx.restore();
  }
};

/* ---------- opções comuns ---------- */
function fonteGraf() { return getComputedStyle(document.body).fontFamily || 'Ubuntu, sans-serif'; }
function opcoesBase(pal, tela) {
  return {
    responsive: !!tela,
    maintainAspectRatio: false,
    animation: tela && !reduzMovimento() ? { duration: 260 } : false,
    devicePixelRatio: tela ? undefined : 2,
    layout: { padding: { top: 6, right: 10, bottom: 0, left: 2 } },
    interaction: { mode: 'nearest', intersect: true },
    plugins: {
      legend: { display: false },
      tooltip: {
        enabled: !!tela,
        backgroundColor: pal.texto, titleColor: pal.superficie, bodyColor: pal.superficie, footerColor: pal.superficie,
        padding: 10, cornerRadius: 8, boxPadding: 4, usePointStyle: true,
        titleFont: { family: fonteGraf(), weight: '700', size: 12 }, bodyFont: { family: fonteGraf(), size: 12 }, footerFont: { family: fonteGraf(), size: 11, weight: '400' }
      }
    }
  };
}
function eixoCategoria(pal, extra = {}) {
  return { grid: { display: false }, border: { color: pal.eixo }, ticks: { color: pal.texto2, font: { family: fonteGraf(), size: 11.5 }, ...extra.ticks }, ...extra.base };
}
function eixoValor(pal, fmt, extra = {}) {
  return { beginAtZero: true, grid: { color: pal.grade }, border: { display: false }, ticks: { color: pal.texto2, font: { family: fonteGraf(), size: 11.5 }, callback: v => fmt(v), maxTicksLimit: 6 }, ...extra };
}
function aoClicarGrafico(fn) {
  return {
    onClick: (ev, els, chart) => {
      if (!els || !els.length) return;
      // no modo "index" vêm os pontos de todas as séries naquele mês: fica com o mais próximo do clique
      let alvo = els[0];
      if (els.length > 1) { try { const perto = chart.getElementsAtEventForMode(ev, 'nearest', { intersect: false }, true); if (perto && perto.length) alvo = perto[0]; } catch (e) { /* mantém o primeiro */ } }
      const { datasetIndex, index } = alvo;
      // a navegação redesenha a tela e destrói este gráfico: deixa o Chart.js terminar o evento antes
      setTimeout(() => fn(datasetIndex, index, chart), 0);
    },
    onHover: (ev, els) => { const c = ev.native && ev.native.target; if (c) c.style.cursor = els && els.length ? 'pointer' : 'default'; }
  };
}

/* ---------- montagem na tela ---------- */
let idGraf = 0;
function graficoHTML(specFn, { altura = 300, rotulo = '' } = {}) {
  const id = 'g' + (++idGraf);
  GRAF.pendentes.push({ id, specFn });
  return `<div class="grafico" style="height:${Math.round(altura)}px"><canvas id="cv-${id}" role="img" aria-label="${esc(rotulo)}"></canvas>${window.Chart ? '' : '<div class="grafico-carregando">Carregando gráfico…</div>'}</div>`;
}
function destruirGraficos() {
  for (const c of GRAF.instancias) { try { c.destroy(); } catch (e) { /* já destruído */ } }
  GRAF.instancias = [];
}
function montarGraficos() {
  destruirGraficos();
  if (!window.Chart) return;
  const pal = paletaAtual();
  for (const g of GRAF.pendentes) {
    const cv = document.getElementById('cv-' + g.id);
    if (!cv) continue;
    const vazio = cv.parentElement.querySelector('.grafico-carregando');
    if (vazio) vazio.remove();
    try {
      const cfg = g.specFn(pal, true);
      if (cfg) GRAF.instancias.push(new Chart(cv, cfg));
    } catch (e) { console.error('Falha ao desenhar gráfico', e); }
  }
}
/* imagem PNG de um gráfico no tema claro (para PDF) */
function imagemGrafico(specFn, largura = 1600, altura = 700) {
  if (!window.Chart) return null;
  // o Chart.js (sem responsive) desenha no tamanho dos atributos do canvas; com devicePixelRatio 2
  // a imagem final tem largura × altura pixels e as fontes ficam legíveis no A4
  const cv = document.createElement('canvas');
  cv.width = Math.round(largura / 2); cv.height = Math.round(altura / 2);
  cv.style.width = (largura / 2) + 'px'; cv.style.height = (altura / 2) + 'px';
  const box = document.createElement('div');
  box.style.cssText = `position:fixed;left:-99999px;top:0;width:${largura / 2}px;height:${altura / 2}px;`;
  box.appendChild(cv);
  document.body.appendChild(box);
  let url = null, ch = null;
  try {
    const cfg = specFn(PALETA_CLARA, false);
    if (!cfg) return null;
    cfg.options = cfg.options || {};
    cfg.options.responsive = false;
    cfg.options.animation = false;
    cfg.options.devicePixelRatio = 2;
    cfg.plugins = [...(cfg.plugins || []), { id: 'fundoBranco', beforeDraw(c) { const x = c.ctx; x.save(); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, c.height); x.restore(); } }];
    ch = new Chart(cv, cfg);
    url = cv.toDataURL('image/png');
  } catch (e) { console.error('Falha ao gerar imagem do gráfico', e); }
  finally { if (ch) ch.destroy(); box.remove(); }
  return url;
}

/* ---------- specs reutilizáveis ---------- */
/* linhas por função ao longo dos meses (evolução), com quebra de série */
function specEvolucao({ meses, series, formato = 'int', rotuloEixo = '', aoClicar, metas }) {
  return (pal, tela) => {
    const idxQuebra = meses.map((y, i) => infoMes(y).quebraSerie ? i : -1).filter(i => i > 0);
    const cfg = {
      type: 'line',
      data: {
        labels: meses.map(rotuloYMCurto),
        datasets: series.map(s => ({
          label: s.rotulo, data: s.dados, borderColor: s.cor ? s.cor(pal) : pal.funcao[s.funcao], backgroundColor: s.cor ? s.cor(pal) : pal.funcao[s.funcao],
          borderWidth: s.tracejada ? 1.5 : 2, borderDash: s.tracejada ? [6, 4] : undefined, pointRadius: s.tracejada ? 0 : 4, pointHoverRadius: 6,
          pointBorderColor: pal.superficie, pointBorderWidth: 2, spanGaps: false, tension: 0, stepped: s.degrau ? 'middle' : false
        }))
      },
      options: {
        ...opcoesBase(pal, tela),
        interaction: { mode: 'index', intersect: false },
        scales: { x: eixoCategoria(pal), y: eixoValor(pal, v => fNum(v, formato === 'd1' ? 'int' : formato), { title: rotuloEixo ? { display: true, text: rotuloEixo, color: pal.texto2, font: { family: fonteGraf(), size: 11 } } : undefined }) },
        plugins: {
          ...opcoesBase(pal, tela).plugins,
          quebraSerie: { indices: idxQuebra, cor: pal.warn, corTexto: pal.texto2, rotulo: 'Quebra de série' },
          tooltip: {
            ...opcoesBase(pal, tela).plugins.tooltip,
            callbacks: {
              title: items => items.length ? rotuloYM(meses[items[0].dataIndex]) : '',
              label: it => `${it.dataset.label}: ${fNum(it.parsed.y, formato)}`,
              footer: items => {
                const y = meses[items[0].dataIndex];
                const linhas = [];
                if (metas) for (const m of metas(y)) linhas.push(m);
                if (infoMes(y).quebraSerie) linhas.push('Quebra de série: ' + infoMes(y).escopo);
                return linhas.join('\n');
              }
            }
          }
        },
        ...(aoClicar ? aoClicarGrafico((di, i) => aoClicar(series[di], meses[i])) : {})
      },
      plugins: [pluginQuebra]
    };
    return cfg;
  };
}
/* barras horizontais por colaborador com linha da meta e faixa de tolerância */
function specBarrasColab({ linhas, valor, formato = 'd1', meta, tolerancia, cor, aoClicar, rotuloValor = '', rodapeDica }) {
  return (pal, tela) => {

        }]

        ...opcoesBase(pal, tela),
        indexAxis: 'y',
        layout: { padding: { right: 46, top: 18 } },
        scales: {

        },

          ...opcoesBase(pal, tela).plugins,

          valorFimBarra: { formatar: v => fNum(v, formato), cor: pal.texto2 },
          tooltip: {
            ...opcoesBase(pal, tela).plugins.tooltip,
            callbacks: {
              title: items => items.length ? linhas[items[0].dataIndex].nomeCompleto || linhas[items[0].dataIndex].nome : '',
              label: it => `${rotuloValor}: ${fNum(it.parsed.x, formato)}`,

            }
          }
        },
        ...(aoClicar ? aoClicarGrafico((di, i) => aoClicar(linhas[i])) : {})

  };
}

function periodo() {
  const fim = UI.ym;
  if (fim == null) return null;
  if (UI.visao === 'acumulado') {
    let ini = UI.inicioAcum != null && UI.inicioAcum <= fim ? UI.inicioAcum : ymDe(anoDe(fim), 1);
    return { ini, fim, mensal: false, rotulo: rotuloPeriodo(ini, fim), rotuloLongo: ini === fim ? rotuloYM(fim) : `${rotuloYM(ini)} a ${rotuloYM(fim)}` };
  }
  return { ini: fim, fim, mensal: true, rotulo: rotuloYM(fim), rotuloLongo: rotuloYM(fim) };
}
function periodoAnteriorUI() {
  const p = periodo();
  if (!p) return null;
  const a = periodoAnterior(p.ini, p.fim, UI.visao);
  if (!a || !lancamentosPeriodo(a[0], a[1]).length) return null;
  return { ini: a[0], fim: a[1], rotulo: UI.visao === 'acumulado' ? `acumulado até ${rotuloYM(a[1]).toLowerCase()}` : rotuloYM(a[1]).toLowerCase() };
}
function mesesDoAnoAte(ym) {

/* ---------- navegação ---------- */
function navegar(rota, params = {}, modo = 'menu') {
  if (rota === 'importar' && !podeEditar()) { toast('Importar é exclusivo de quem pode editar o painel.', 'erro'); return; }
  if (params && params.ym != null && Number.isFinite(params.ym)) UI.ym = params.ym;
  if (rota === 'funcao' && params.f) UI.funcaoModulo = params.f;
  const novo = { rota, params: { ...params } };
  if (modo === 'menu') {
    UI.trilha = rota === 'painel' ? [{ rota: 'painel', params: {} }] : [{ rota: 'painel', params: {} }, novo];
  } else if (modo === 'detalhe') {
    const ult = UI.trilha[UI.trilha.length - 1];
    if (!(ult.rota === rota && iguais(ult.params, novo.params))) {
      if (rota === 'ficha' && params.ym != null && !(ult.rota === 'ficha' && ult.params.codigo === params.codigo)) {
        UI.trilha.push({ rota: 'ficha', params: { codigo: params.codigo } });
        UI.trilha.push({ rota: 'ficha', params: { codigo: params.codigo, ym: params.ym, f: params.f }, mes: true });
      } else if (rota === 'ficha' && params.ym != null) {
        UI.trilha.push({ ...novo, mes: true });
      } else UI.trilha.push(novo);
    }
  }
  UI.rota = rota;
  UI.params = { ...params };
  UI.gavetaAberta = false;
  salvarPreferencias();
  render({ rolarTopo: true });
}
function voltar() {
  if (UI.trilha.length <= 1) { navegar('painel', {}, 'menu'); return; }
  UI.trilha.pop();
  const ult = UI.trilha[UI.trilha.length - 1];
  UI.rota = ult.rota; UI.params = { ...ult.params };
  if (ult.params.ym != null) UI.ym = ult.params.ym;
  salvarPreferencias();
  render({ rolarTopo: true });
}
function irTrilha(i) {
  UI.trilha = UI.trilha.slice(0, i + 1);
  const ult = UI.trilha[i];
  UI.rota = ult.rota; UI.params = { ...ult.params };
  if (ult.params.ym != null) UI.ym = ult.params.ym;
  salvarPreferencias();
  render({ rolarTopo: true });
}
function salvarPreferencias() {
  Preferencias.gravar({ rota: UI.rota, params: UI.params, trilha: UI.trilha, ym: UI.ym, visao: UI.visao, inicioAcum: UI.inicioAcum, funcao: UI.funcao, leitura: UI.leitura, funcaoModulo: UI.funcaoModulo });
}
function restaurarPreferencias() {
  const p = Preferencias.ler();
  if (p.visao === 'acumulado' || p.visao === 'mensal') UI.visao = p.visao;
  if (p.leitura === 'principal' || p.leitura === 'todos') UI.leitura = p.leitura;
  if (p.funcao === '' || FUNC[p.funcao]) UI.funcao = p.funcao || '';
  if (FUNC[p.funcaoModulo]) UI.funcaoModulo = p.funcaoModulo;
  if (Number.isFinite(p.ym)) UI.ym = p.ym;
  if (Number.isFinite(p.inicioAcum)) UI.inicioAcum = p.inicioAcum;
  if (p.rota && VIEWS_VALIDAS.includes(p.rota)) {
    UI.rota = p.rota; UI.params = p.params || {};
    UI.trilha = Array.isArray(p.trilha) && p.trilha.length ? p.trilha.filter(t => VIEWS_VALIDAS.includes(t.rota)) : [{ rota: 'painel', params: {} }];
    if (!UI.trilha.length) UI.trilha = [{ rota: 'painel', params: {} }];
  }
}

/* ---------- eventos globais ---------- */
const ACOES = {};
function ligarEventos() {
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-acao]');
    if (!el || el.disabled) return;
    const controle = ev.target.closest('select, input, textarea, label, a[href]');
    if (controle && controle !== el && el.contains(controle)) return;
    const acao = el.getAttribute('data-acao');
    let p = null;
    const raw = el.getAttribute('data-p');
    if (raw) { try { p = JSON.parse(raw); } catch (e) { p = raw; } }
    const fn = ACOES[acao];
    if (fn) { ev.preventDefault(); fn(p, el, ev); }
  });
  document.addEventListener('keydown', ev => {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('tr[data-acao], td[data-acao], div[data-acao][tabindex]')) {
      ev.preventDefault();
      ev.target.click();
    }
    if (ev.key === 'Escape' && UI.gavetaAberta) { UI.gavetaAberta = false; render(); }
  });
  document.addEventListener('change', ev => {
    const id = ev.target.id;
    if (id === 'sel-mes') {
      const v = Number(ev.target.value);
      if (Number.isFinite(v)) {
        UI.ym = v;
        if (UI.inicioAcum != null && (UI.inicioAcum > v || anoDe(UI.inicioAcum) !== anoDe(v))) UI.inicioAcum = null;
        const ult = UI.trilha[UI.trilha.length - 1];
        if (ult && ult.params && ult.params.ym != null) { ult.params.ym = v; UI.params.ym = v; }
        salvarPreferencias();
        render();
      }
    } else if (id === 'sel-inicio') {
      UI.inicioAcum = Number(ev.target.value);
      salvarPreferencias(); render();
    } else if (id === 'sel-funcao') {
      UI.funcao = ev.target.value || '';
      if (UI.funcao) UI.funcaoModulo = UI.funcao;
      if (UI.rota === 'funcao' && UI.funcao) { UI.params.f = UI.funcao; const ult = UI.trilha[UI.trilha.length - 1]; if (ult.rota === 'funcao') ult.params.f = UI.funcao; }
      salvarPreferencias(); render();
    }
  });
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  if (mq && mq.addEventListener) mq.addEventListener('change', () => render());
  new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

/* ranking de uma função: elegíveis, não elegíveis (cinza) e apoio (separado) */
function modeloRanking({ ini, fim, funcao, leitura, visao, completa = true, comMovimento = true }) {
  const rk = ranking(ini, fim, funcao, leitura);
  const { topo, fim: ultimos } = primeirosEUltimos(rk);
  const topoSet = new Set(topo.map(r => r.codigo)), fimSet = new Set(ultimos.map(r => r.codigo));
  const linhas = [];
  rk.eleg.forEach(r => linhas.push({ ...r, _pos: rk.pos.get(r.codigo), _mov: comMovimento ? movimento(ini, fim, funcao, leitura, r.codigo, visao) : null, _tipo: 'eleg' }));
  if (rk.nao.length) { linhas.push({ _grupo: `Fora do ranking (menos de ${P().minimoDias} dias na função ou sem meta)` }); rk.nao.forEach(r => linhas.push({ ...r, _tipo: 'nao' })); }
  if (rk.apoio.length) { linhas.push({ _grupo: 'Apoio: função principal diferente (não comparados com quem faz a função o mês inteiro)' }); rk.apoio.forEach(r => linhas.push({ ...r, _tipo: 'apoio' })); }
  const posCel = l => l._pos ? `<span class="pos${l._pos <= 3 ? ' p' + l._pos : ''}">${l._pos}</span>` : `<span class="fraco">${l._tipo === 'apoio' ? 'apoio' : TRACO}</span>`;
  const cols = [

  for (const y of meses) for (const r of linhasFuncao(y, y, funcao)) { const c = cods.get(r.codigo) || { codigo: r.codigo, nome: r.nome, itens: 0, apoio: r.apoio }; c.itens += r.ag.skus; cods.set(r.codigo, c); }
  const linhas = [...cods.values()].sort((a, b) => (a.apoio - b.apoio) || (b.itens - a.itens));
  return modeloSimples([
    { id: 'nome', rotulo: 'Colaborador', valor: l => l.nome + (l.apoio ? ' (apoio)' : '') },
    ...meses.map(y => ({ id: 'm' + y, rotulo: rotuloYMCurto(y), tipo: 'pct', valor: l => { const r = linhasFuncao(y, y, funcao).find(x => x.codigo === l.codigo); return r ? r.ind.indice : null; },
      texto: l => { const r = linhasFuncao(y, y, funcao).find(x => x.codigo === l.codigo); return !r ? '' : r.ind.indice != null ? fPct(r.ind.indice) : `${r.ag.dias} dias`; } }))
  ], linhas);
}

    </div>
    <div class="grade-2">
      ${bloco({ titulo: 'Participação no volume da função (concentração)', desc: `Parte dos itens feita por cada colaborador. Acima de ${fPct(P().limiteConcentracao)} para uma pessoa indica risco de dependência.`, corpo: part ? graficoHTML(part, { altura: Math.max(200, (conc.ordenado.length) * 28 + 50), rotulo: 'Participação no volume' }) : '<p class="muted">Sem volume no período.</p>' })}
      ${bloco({ titulo: 'Evolução da produtividade da equipe', desc: 'Itens/dia da equipe mês a mês contra a meta vigente em cada mês. Clique num ponto para abrir o mês.', corpo: graficoHTML(equipe, { altura: 300, rotulo: 'Evolução itens por dia da equipe' }) + `<div class="legenda" style="margin-top:8px"><span class="it"><span class="ln" style="border-color:var(${f.cor})"></span>Itens/dia da equipe</span><span class="it"><span class="ln trac" style="border-color:var(--text)"></span>Meta</span>${quebrasNoIntervalo(meses[0] ?? p.fim, p.fim).length ? LEGENDA_QUEBRA : ''}</div>` })}
    </div>
    ${bloco({ titulo: 'Equipe mês a mês', corpo: tabelaHTML(modeloEquipe) })}
  `;
  const exportar = {
    titulo: f.nome, subtitulo: `${p.rotuloLongo} · ${p.mensal ? 'visão mensal' : 'acumulado'} · leitura: ${rotuloLeitura().toLowerCase()}`,
    secoes: [
      { tipo: 'kpis', titulo: 'Indicadores da função', itens: cards.map(itemKpiExport) },
      ...(fId === 'recebimento' ? [{ tipo: 'texto', titulo: 'Volume recebido', paragrafos: [`Notas fiscais: ${fInt(t.ag.nfs)} · itens recebidos: ${fInt(t.ag.skus)} · itens por NF: ${fD1(t.ind.itensPorDoc)}. A produtividade do conferente de recebimento depende do volume que chega: compare o volume antes de comparar pessoas.`] }] : []),
      { tipo: 'tabela', titulo: `Ranking: ${f.nome}`, modelo: mr },
      { tipo: 'grafico', titulo: 'Itens/dia por colaborador (linha: meta)', specFn: barras, altura: Math.max(220, linhasG.length * 30 + 50) },
      { tipo: 'grafico', titulo: 'Perfil de trabalho: itens/dia × unidades por item', specFn: disp },
      ...(part ? [{ tipo: 'grafico', titulo: 'Participação no volume da função', specFn: part, altura: Math.max(200, conc.ordenado.length * 28 + 50) }] : []),
      { tipo: 'grafico', titulo: 'Evolução da produtividade da equipe', specFn: equipe },
      { tipo: 'tabela', titulo: 'Equipe mês a mês', modelo: modeloEquipe }
    ]
  };
  return { html, exportar };
};

/* =========================================================================
   Rankings: mensal, acumulado, evolução de posições e campeões do mês.

function abasHTML(abas, atual, acao, extraParams = {}) {
  return `<div class="abas" role="tablist">${abas.map(a => `<button type="button" role="tab" aria-selected="${a.id === atual}"${dataAcao(acao, { ...extraParams, aba: a.id })}>${esc(a.rotulo)}</button>`).join('')}</div>`;
}
ACOES['aba-rankings'] = p => { UI.params.aba = p.aba; const ult = UI.trilha[UI.trilha.length - 1]; if (ult.rota === 'rankings') ult.params.aba = p.aba; salvarPreferencias(); render(); };

function periodoAcumuladoUI() {
  const fim = UI.ym;
  const ini = UI.visao === 'acumulado' && UI.inicioAcum != null && UI.inicioAcum <= fim ? UI.inicioAcum : ymDe(anoDe(fim), 1);
  return { ini, fim };
}
function modeloEvolucaoPosicoes(fId, meses) {
  const cods = new Map();
  for (const y of meses) for (const r of linhasFuncao(y, y, fId)) {
    const c = cods.get(r.codigo) || { codigo: r.codigo, nome: r.nome, apoio: r.apoio, itens: 0 };
    c.itens += r.ag.skus; cods.set(r.codigo, c);
  }
  const linhas = [...cods.values()].sort((a, b) => (a.apoio - b.apoio) || (b.itens - a.itens));
  const cel = (codigo, y) => {
    const rk = ranking(y, y, fId, UI.leitura);
    const pos = rk.pos.get(codigo);
    const r = linhasFuncao(y, y, fId).find(x => x.codigo === codigo);
    if (!r) return { txt: '', cls: 'vazio' };
    if (pos) return { txt: `${pos}º`, cls: r.ind.situacao, r, pos };
    if (UI.leitura === 'principal' && r.apoio) return { txt: 'apoio', cls: 'insuf', r };
    return { txt: r.ind.situacao === 'insuf' ? `${r.ag.dias}d` : TRACO, cls: 'insuf', r };
  };
  return {
    colunas: [
      { id: 'nome', rotulo: 'Colaborador', valor: l => l.nome + (l.apoio ? ' (apoio)' : '') },
      ...meses.map(y => ({ id: 'm' + y, rotulo: rotuloYMCurto(y), valor: l => cel(l.codigo, y).pos ?? null, texto: l => cel(l.codigo, y).txt }))
    ],
    linhas, cel, meses
  };
}
function htmlEvolucaoPosicoes(fId, meses) {
  const m = modeloEvolucaoPosicoes(fId, meses);
  if (!m.linhas.length) return '<p class="muted">Sem lançamentos.</p>';
  const cab = `<tr><th scope="col" style="text-align:left">Colaborador</th>${meses.map(y => `<th scope="col" class="${y === UI.ym ? 'mes-atual' : ''}">${esc(rotuloYMCurto(y))}</th>`).join('')}</tr>`;
  const corpo = m.linhas.map(l => `<tr><td class="nome">${esc(l.nome)}${l.apoio ? ' <span class="selo apoio">apoio</span>' : ''}</td>${meses.map(y => {
    const c = m.cel(l.codigo, y);
    if (c.cls === 'vazio') return '<td class="cel sem-dado"></td>';
    const dica = `${l.nome} · ${rotuloYM(y)}\n${c.pos ? `${c.pos}º lugar · índice ${fPct(c.r.ind.indice)}` : c.txt === 'apoio' ? 'Apoio (função principal diferente)' : c.r.ind.motivo}`;
    return `<td class="cel ${c.cls}${y === UI.ym ? ' mes-atual' : ''}" tabindex="0"${dataAcao('ficha', { codigo: l.codigo, ym: y, f: fId })} data-dica="${esc(dica)}">${esc(c.txt)}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="calor-wrap"><table class="calor"><thead>${cab}</thead><tbody>${corpo}</tbody></table></div>`;
}
function modeloCampeoes(meses, fs) {
  return modeloSimples([
    { id: 'mes', rotulo: 'Mês', valor: l => rotuloYM(l.y) },
    ...fs.map(f => ({
      id: f.id, rotulo: f.nome,
      valor: l => { const c = campeao(l.y, f.id, UI.leitura); return c ? `${c.nome} (${fPct(c.ind.indice)})` : TRACO; },
      html: l => { const c = campeao(l.y, f.id, UI.leitura); return c ? `<button type="button" class="btn fantasma peq"${dataAcao('ficha', { codigo: c.codigo, ym: l.y, f: f.id })}>${icone('trofeu')}<span>${esc(c.nome)}</span></button> <span class="muted">${fPct(c.ind.indice)} · ${fD1(c.ind.itensDia)} itens/dia</span>` : `<span class="fraco">${TRACO}</span>`; }
    })),
    { id: 'esc', rotulo: 'Escopo', valor: l => infoMes(l.y).escopo, html: l => infoMes(l.y).quebraSerie ? `<span class="selo rotas">quebra de série</span> ${esc(infoMes(l.y).escopo)}` : esc(infoMes(l.y).escopo), ocultoCel: true }
  ], meses.slice().reverse().map(y => ({ y })), { cartoes: true });
}

VIEWS.rankings = params => {
  const aba = ['mensal', 'acumulado', 'evolucao', 'campeoes'].includes(params.aba) ? params.aba : (UI.visao === 'acumulado' ? 'acumulado' : 'mensal');
  const fs = funcoesFiltradas();
  const ym = UI.ym;
  const pa = periodoAcumuladoUI();
  const meses = mesesDoAnoAte(ym);
  const abas = [
    { id: 'mensal', rotulo: 'Mensal' }, { id: 'acumulado', rotulo: 'Acumulado' },
    { id: 'evolucao', rotulo: 'Evolução de posições' }, { id: 'campeoes', rotulo: 'Campeões do mês' }
  ];
  let corpo = '', secoes = [];
  if (aba === 'mensal' || aba === 'acumulado') {
    const ini = aba === 'mensal' ? ym : pa.ini;
    corpo = fs.map(f => {
      const m = modeloRanking({ ini, fim: ym, funcao: f.id, leitura: UI.leitura, visao: aba === 'mensal' ? 'mensal' : 'acumulado' });
      secoes.push({ tipo: 'tabela', titulo: `${aba === 'mensal' ? 'Ranking mensal' : 'Ranking acumulado'}: ${f.nome}`, modelo: m });

    }).join('');
  } else if (aba === 'evolucao') {
    corpo = fs.map(f => {
      secoes.push({ tipo: 'tabela', titulo: `Evolução de posições: ${f.nome}`, modelo: modeloEvolucaoPosicoes(f.id, meses) });
      return bloco({ titulo: `${f.nome}: colocação mês a mês`, desc: 'Posição no ranking mensal, colorida pela situação. "apoio": função principal diferente; "Nd": N dias, abaixo do mínimo.', corpo: htmlEvolucaoPosicoes(f.id, meses) });
    }).join('');
  } else {
    const m = modeloCampeoes(meses, fs);
    secoes.push({ tipo: 'tabela', titulo: 'Campeões do mês', modelo: m });
    corpo = bloco({ titulo: 'Campeões do mês por função', desc: 'O 1º colocado de cada função em cada mês, pelo Índice de Eficiência.', corpo: tabelaHTML(m) });
  }
  const html = `${cabecalhoTela('Rankings', `${esc(aba === 'acumulado' ? rotuloPeriodo(pa.ini, ym) : rotuloYM(ym))} · leitura: ${esc(rotuloLeitura().toLowerCase())} · ${UI.funcao ? esc(FUNC[UI.funcao].nome) : 'as três funções, cada uma no seu ranking'}`, seletorLeitura())}
    ${abasHTML(abas, aba, 'aba-rankings')}
    ${aba !== 'campeoes' ? avisoQuebraPeriodo(aba === 'acumulado' ? { ini: pa.ini, fim: ym, mensal: false } : { ini: ym, fim: ym, mensal: true }) : ''}
    ${corpo}`;
  return { html, exportar: { titulo: `Rankings: ${abas.find(a => a.id === aba).rotulo}`, subtitulo: `${aba === 'acumulado' ? rotuloPeriodo(pa.ini, ym) : rotuloYM(ym)} · leitura: ${rotuloLeitura().toLowerCase()}`, secoes } };
};

function situacaoColabHTML(c) {
  if (!c) return '<span class="selo revisar">sem cadastro</span>';
  if (c.status === 'desligado') return `<span class="selo">desligado${c.dataDesligamento ? ` em ${esc(fData(c.dataDesligamento))}` : ''}</span>`;
  return '<span class="selo novo">ativo</span>';
}
function buscarColaboradores(termo) {
  const t = norm(termo);
  const cods = todosCodigos();
  const lista = cods.map(codigo => ({ codigo, nome: nomeExib(codigo), completo: nomeCompleto(codigo), principal: funcaoPrincipalDe(codigo), ultima: ultimaAtividade(codigo), desligado: estaDesligado(codigo) }));
  if (!t) return lista;
  return lista.filter(c => norm(c.codigo).startsWith(t) || norm(c.completo).includes(t) || norm(c.nome).includes(t));
}
function itemColabHTML(c) {

  </button>`;
}
function atualizarSugestoes(input) {
  const caixa = document.getElementById('sugestoes-ficha');

  UI.buscaFicha = t;
  if (!t) { caixa.hidden = true; caixa.innerHTML = ''; return; }

  caixa.innerHTML = r.length ? r.map((c, i) => `<button type="button"${i === 0 ? ' class="ativo"' : ''}${dataAcao('ficha', { codigo: c.codigo })}><span class="av" style="background:${corAvatar(c.codigo)};width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700">${esc(iniciais(c.completo))}</span><span><b>${esc(c.nome)}</b> <span class="muted">· ${esc(c.codigo)} · ${esc(c.completo)}</span></span></button>`).join('') : '<div class="vazio-tabela">Ninguém encontrado com esse nome ou código.</div>';
  caixa.hidden = false;
}
function caixaBusca() {

}

function htmlCalendario(codigo, ym) {
  const ano = anoDe(ym), mes = mesDe(ym);
  const pr = presenca(ym, codigo);
  const opDias = new Set(); for (const l of lancamentosPeriodo(ym, ym)) l.diasLista.forEach(d => opDias.add(d));
  const primeiro = new Date(ano, mes - 1, 1).getDay();
  const total = diasNoMes(ano, mes);
  let html = DIAS_SEMANA.map(d => `<div class="dsem">${d}</div>`).join('');
  for (let i = 0; i < primeiro; i++) html += '<div class="dia vazio"></div>';
  for (let d = 1; d <= total; d++) {
    const fs = FUNCOES.filter(f => (pr.porFuncao[f.id] || []).includes(d));
    const trabalhou = fs.length > 0;
    const dica = trabalhou ? `${d}/${String(mes).padStart(2, '0')}: ${fs.map(f => f.nome).join(' + ')}` : (opDias.has(d) ? `${d}/${String(mes).padStart(2, '0')}: CD operou, sem registro deste colaborador` : `${d}/${String(mes).padStart(2, '0')}: sem movimento no CD`);
    html += `<div class="dia${trabalhou ? ' trabalhou' : ''}${opDias.has(d) ? '' : ' fora'}" data-dica="${esc(dica)}"><span class="n">${d}</span><span class="marcas">${fs.map(f => `<i style="background:var(${f.cor})"></i>`).join('')}</span></div>`;
  }
  return `<div class="calendario" role="img" aria-label="${esc(`Dias trabalhados em ${rotuloYM(ym)}: ${pr.presenca} dias de presença`)}">${html}</div>
    <div class="legenda" style="margin-top:10px">${FUNCOES.filter(f => pr.porFuncao[f.id]).map(f => `<span class="it"><span class="sw" style="background:var(${f.cor})"></span>${esc(f.nome)} (${pr.porFuncao[f.id].length} dias)</span>`).join('')}<span class="it"><span class="sw" style="border:1px dashed var(--border-strong)"></span>dia sem movimento no CD</span></div>
    <p class="nota-tabela">Presença: <b>${pr.presenca}</b> dias · dias-função: <b>${pr.diasFuncao}</b>${pr.fatiamento != null ? ` · índice de fatiamento: <b>${fD2(pr.fatiamento)}</b>` : ''}${pr.diasOperacao ? ` · dias de operação do CD: ${pr.diasOperacao}` : ''}</p>`;
}
function cartoesFicha(codigo, ini, fim, rotulo) {

    const mov = pos ? movimento(ini, fim, f.id, UI.leitura, codigo, ini === fim ? 'mensal' : 'acumulado') : null;
    cards.push(`<div class="bloco" style="padding:14px">
      <div class="linha" style="justify-content:space-between;margin-bottom:8px">${funcTag(f.id)}<span class="muted" style="font-size:12px">${esc(rotulo)}</span></div>
      <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">

        ${kpiHTML({ rotulo: 'Itens/dia', valor: r.ind.itensDia, formato: 'd1', detalhe: `meta ${fD1(r.ind.metaItens)} · ${fPct(r.ind.pctItens)}` })}

        ${kpiHTML({ rotulo: 'Dias / itens', valorHTML: `${fInt(r.ag.dias)} <small>dias</small>`, detalhe: `${fInt(r.ag.skus)} itens · ${fInt(r.ag.unidades)} unid. · ${fInt(r.ag.documentos)} ${f.id === 'recebimento' ? 'NF' : 'pedidos'}` })}
      </div></div>`);
  }
  return cards.length ? cards.join('') : `<p class="muted">Sem lançamentos em ${esc(rotulo.toLowerCase())}.</p>`;
}
function specFichaFuncao(codigo, fId, meses) {
  return specEvolucao({
    meses,
    series: [
      { funcao: fId, rotulo: 'Itens/dia', dados: meses.map(y => { const r = linhasFuncao(y, y, fId).find(x => x.codigo === codigo); return r ? r.ind.itensDia : null; }) },

function modeloPosicoesColab(codigo, meses) {
  const fs = FUNCOES.filter(f => meses.some(y => linhasFuncao(y, y, f.id).some(r => r.codigo === codigo)));
  const cel = (f, y) => {
    const r = linhasFuncao(y, y, f.id).find(x => x.codigo === codigo);

function modeloLancamentosColab(codigo, ano) {

function avisosFicha(codigo, ym) {
  const av = [];
  const c = colab(codigo);
  if (c && c.rotasExternas) av.push(avisoHTML('atencao', '<b>Produção parcialmente registrada até set/2026.</b> A separação e a conferência das rotas externas eram manuais e passaram para o coletor no fim de setembro/2026. Antes disso, a produção deste colaborador nas rotas externas não aparece no coletor: compare os meses anteriores com cautela.'));
  if (!c) av.push(avisoHTML('atencao', `Código ${esc(codigo)} sem cadastro de colaborador. Cadastre em Colaboradores para definir a função principal.`));
  if (c && c.revisar) av.push(avisoHTML('info', `<b>Cadastro a revisar:</b> ${esc(semPonto(c.motivoRevisao || 'confirmar função principal'))}.`));
  if (estaDesligado(codigo)) av.push(avisoHTML('info', `Colaborador desligado${c && c.dataDesligamento ? ` em ${esc(fData(c.dataDesligamento))}` : ''}. O histórico dos meses trabalhados continua valendo.`));
  const pr = presenca(ym, codigo);
  if (pr.lancs.length) {
    const principal = funcaoPrincipalDe(codigo);
    const apoio = pr.funcoes.filter(f => f !== principal);
    if (apoio.length) av.push(avisoHTML('info', `Em ${esc(rotuloYM(ym).toLowerCase())} atuou como <b>apoio</b> em ${esc(apoio.map(f => FUNC[f].nome).join(' e '))} (função principal: ${esc(FUNC[principal]?.nome || 'não definida')}).`));
    const insuf = pr.lancs.filter(l => l.diasFuncao < P().minimoDias);
    if (insuf.length) av.push(avisoHTML('info', `<b>Dias insuficientes</b> para o ranking em ${esc(insuf.map(l => `${FUNC[l.funcao].nome} (${l.diasFuncao} ${l.diasFuncao === 1 ? 'dia' : 'dias'})`).join(', '))}: mínimo de ${P().minimoDias} dias.`));
    if (pr.diasFuncao > pr.presenca) av.push(avisoHTML('atencao', `<b>Dia dividido entre funções:</b> ${pr.diasFuncao} dias-função em ${pr.presenca} dias de presença (fatiamento ${fD2(pr.fatiamento)}). A produtividade por dia em cada função está subestimada.`));
    if (pr.lancs.some(l => l.suspeito)) av.push(avisoHTML('erro', '<b>Lançamento suspeito neste mês</b> (possível duplicidade). Veja em Auditoria.'));
    if (infoMes(ym).quebraSerie) av.push(avisoHTML('atencao', `Mês com quebra de série: ${esc(infoMes(ym).escopo)}.`));
  }
  return av.join('');
}

            <td><input class="inp" type="number" step="any" data-p75="${s.funcao}|itensDia" value="${ok(s.itensDia) ? Math.round(s.itensDia) : ''}" style="max-width:110px"></td>
            <td><input class="inp" type="number" step="any" data-p75="${s.funcao}|unidadesDia" value="${ok(s.unidadesDia) ? Math.round(s.unidadesDia / 100) * 100 : ''}" style="max-width:120px"></td>
            <td><input class="inp" type="number" step="any" data-p75="${s.funcao}|documentosDia" value="${ok(s.documentosDia) ? arred(s.documentosDia, 1) : ''}" style="max-width:100px"></td></tr>`;
        }).join('')}</tbody></table></div><p class="nota-tabela">Período: ${esc(rotuloPeriodo(ini, fim))} · lançamentos com ${min}+ dias. Os campos "Gravar" vêm arredondados e podem ser ajustados antes de confirmar.</p>`;
        raiz.dataset.p75 = JSON.stringify({ ini, fim, min });

      $('#p75-calc', raiz).addEventListener('click', calc);
      calc();

    botoes: [{ rotulo: 'Fechar sem gravar', classe: 'fantasma' }, { rotulo: 'Confirmar e gravar metas', classe: 'primario', acao: async ctrl => {
      if (!podeEditar()) return false;

    } }]
  });
}

async function alternarMes(ym, situacao) {
  const im = infoMes(ym);
  if (situacao === 'fechado') {
    const aud = auditoria(anoDe(ym));
    const difs = aud.amarracao.some(a => Math.abs(a.dif.dias) + Math.abs(a.dif.itens) + Math.abs(a.dif.unidades) > 0.5);
    const sim = await confirmar({ titulo: `Fechar ${rotuloYM(ym)}`, texto: `<p>Mês fechado bloqueia inclusão, edição, exclusão e importação até ser reaberto.</p>${difs ? avisoHTML('erro', 'A auditoria do ano tem diferença diferente de zero. Confira antes de fechar.') : avisoHTML('ok', 'Auditoria do ano com diferença zero.')}<p class="muted">Depois de fechar, gere o Relatório Executivo em Relatórios e Exportação.</p>`, rotuloOk: 'Fechar mês' });
    if (!sim) return;
  }
  const antes = docMes(ym) ? docSimplesParaBanco(docMes(ym)) : null;
  const doc = { ...(antes || { ano: anoDe(ym), mes: mesDe(ym), diasOperacao: im.diasOperacao, diasOperacaoCalculado: im.diasOperacaoCalculado, escopoColeta: im.escopo, quebraSerie: im.quebraSerie, observacao: '' }), situacao, ...(situacao === 'fechado' ? { fechadoEm: agoraISO() } : { reabertoEm: agoraISO() }), atualizadoEm: agoraISO() };
  await gravarComHistorico([opGravar('meses', chaveYM(ym), doc)], { tipo: 'edicao', colecao: 'meses', alvo: chaveYM(ym), resumo: `${rotuloYM(ym)} ${situacao === 'fechado' ? 'fechado' : 'reaberto'}`, antes, depois: doc }, `${rotuloYM(ym)} ${situacao === 'fechado' ? 'fechado' : 'reaberto'}.`);
}

const BIBLIOTECAS = {

const DOM_PRONTO = new Promise(r => { if (document.readyState !== 'loading') r(); else document.addEventListener('DOMContentLoaded', () => r(), { once: true }); });
function carregarScript(url) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url; s.async = false;
    s.onload = () => res();
    s.onerror = () => { s.remove(); rej(new Error('Falha ao carregar ' + url)); };

function aplicarAutoTable() {

async function garantirBiblioteca(nome) {
  const b = BIBLIOTECAS[nome];
  if (b.global()) return true;
  await DOM_PRONTO;
  if (b.depende) await garantirBiblioteca(b.depende);
  if (nome === 'autotable') aplicarAutoTable();
  if (b.global()) return true;
  if (!b.promessa) {
    b.promessa = (async () => {
      for (const u of b.urls) {
        try { await carregarScript(u); if (nome === 'autotable') aplicarAutoTable(); if (b.global()) return true; } catch (e) { /* tenta o próximo endereço */ }
      }

    })();

/* ---------- leitura do arquivo ---------- */
const COLUNAS_KAIZEN = {
  atividade: ['atividade', 'funcao'],
  mes: ['mes', 'competencia', 'mes referencia'],
  dias: ['dias', 'dias trabalhados', 'dias efetivos', 'dias efetivos de trabalho no mes', 'lista de dias'],
  operador: ['operador', 'colaborador', 'funcionario'],
  qtdeDias: ['qtde dias', 'qtd dias', 'quantidade de dias', 'total de dias', 'total de dias trabalhados'],
  pedidos: ['qtde pedido', 'qtde pedidos', 'qtd pedido', 'qtd pedidos', 'qtde pedido om', 'pedidos'],
  nfs: ['qt conf recebimento', 'qtde conf recebimento', 'qt conf recebimento nf', 'qtd conf recebimento', 'notas fiscais'],
  skus: ['qtde skus', 'qtde sku', 'qtd skus', 'qtd sku', 'skus'],
  media: ['media skus dia', 'media sku dia', 'media skus dia informada kaizen'],
  unidades: ['qtde und', 'qtde unidades', 'qtd und', 'qtd unidades', 'unidades'],
  peso: ['peso kg', 'peso'],
  volume: ['volume m3', 'volume'],
  data: ['data', 'data movimento', 'data do movimento'],
  destino: ['destino', 'canal'],
  divergencias: ['itens divergentes', 'divergencias', 'divergencia', 'qtde divergencias']
