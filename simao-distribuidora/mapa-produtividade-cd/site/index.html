const OBRIGATORIAS = { atividade: 'Atividade', operador: 'Operador', pedidos: 'Qtde Pedido', nfs: 'Qt Conf Recebimento', skus: 'Qtde Skus', unidades: 'Qtde Und' };
function mapearColunas(cab) {
  const mapa = {};
  cab.forEach((h, i) => {
    const n = norm(h);
    if (!n) return;
    for (const [campoK, sins] of Object.entries(COLUNAS_KAIZEN)) {
      if (mapa[campoK] !== undefined) continue;
      if (sins.includes(n)) { mapa[campoK] = i; return; }
    }
  });
  return mapa;
}
function acharCabecalho(linhas) {
  let melhor = { i: -1, n: 0, mapa: {} };
  for (let i = 0; i < Math.min(linhas.length, 12); i++) {
    const mapa = mapearColunas(linhas[i] || []);
    const n = Object.keys(mapa).length;
    if (n > melhor.n) melhor = { i, n, mapa };
  }
  return melhor.n >= 4 ? melhor : null;
}
function decodificarTexto(buf) {
  let t = new TextDecoder('utf-8').decode(buf);
  if (t.includes('\uFFFD')) { try { t = new TextDecoder('windows-1252').decode(buf); } catch (e) { /* mantém utf-8 */ } }
  return t.replace(/^\uFEFF/, '');
}
function lerCSV(texto) {
  const primeira = texto.split(/\r?\n/)[0] || '';
  const sep = [';', '\t', ','].map(s => [s, primeira.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
  const linhas = [];
  let campoAtual = '', linha = [], aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) {
      if (c === '"' && texto[i + 1] === '"') { campoAtual += '"'; i++; }
      else if (c === '"') aspas = false;
      else campoAtual += c;
    } else if (c === '"') aspas = true;
    else if (c === sep) { linha.push(campoAtual); campoAtual = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && texto[i + 1] === '\n') i++;
      linha.push(campoAtual); linhas.push(linha); linha = []; campoAtual = '';
    } else campoAtual += c;
  }
  if (campoAtual !== '' || linha.length) { linha.push(campoAtual); linhas.push(linha); }
  return linhas.filter(l => l.some(x => String(x).trim() !== ''));
}
async function lerArquivo(arquivo) {
  const buf = await arquivo.arrayBuffer();
  const nome = (arquivo.name || '').toLowerCase();
  if (nome.endsWith('.csv') || nome.endsWith('.txt')) return lerCSV(decodificarTexto(buf));
  const okLib = await garantirBiblioteca('xlsx');
  if (!okLib) throw new Error('Não foi possível carregar o leitor de planilhas. Verifique a conexão e tente de novo.');
  const wb = XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
}
function vazioOuZero(v) { return v === null || v === undefined || String(v).trim() === '' || String(v).trim() === '0'; }
function funcaoDoTexto(v) {
  const t = norm(v);
  if (!t) return null;
  if (t.includes('receb')) return 'recebimento';
  if (t.includes('separa')) return 'separacao';
  if (t.includes('exped') || t.includes('saida')) return 'expedicao';
  return null;
}
function dataDaCelula(v) {
  if (v instanceof Date && !isNaN(v)) return v;
  if (typeof v === 'number' && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 86400000) + 12 * 3600000);
  const m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/.exec(String(v || '').trim());
  if (m) { const a = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return new Date(a, +m[2] - 1, +m[1], 12); }
  const iso = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v || '').trim());
  if (iso) return new Date(+iso[1], +iso[2] - 1, +iso[3], 12);
  return null;
}

/* ---------- interpretação ---------- */
function interpretarExtracao(linhas, nomeArquivo) {
  const r = { arquivo: nomeArquivo, erros: [], alertas: [], ignoradas: [], registros: [], lidas: 0, colunas: {}, opcionais: [] };
  const cab = acharCabecalho(linhas);
  if (!cab) { r.erros.push('Não encontrei o cabeçalho da extração (Atividade, Mês, Operador, Qtde Skus…). Confira se é o arquivo de produtividade do Kaizen.'); return r; }
  const m = cab.mapa;
  r.colunas = m;
  const faltando = Object.entries(OBRIGATORIAS).filter(([k]) => m[k] === undefined).map(([, rot]) => rot);
  if (m.mes === undefined && m.data === undefined) faltando.push('Mês');
  if (m.qtdeDias === undefined && m.dias === undefined && m.data === undefined) faltando.push('Qtde Dias');
  if (faltando.length) { r.erros.push(`Coluna obrigatória ausente: ${faltando.join(', ')}.`); return r; }
  r.opcionais = ['data', 'destino', 'divergencias'].filter(k => m[k] !== undefined);
  const brutos = [];
  for (let i = cab.i + 1; i < linhas.length; i++) {
    const l = linhas[i] || [];
    if (!l.some(x => x !== null && String(x).trim() !== '')) continue;
    r.lidas++;
    const nLinha = i + 1;
    const op = l[m.operador], at = l[m.atividade];
    if (vazioOuZero(op) || vazioOuZero(at)) { r.ignoradas.push({ linha: nLinha, motivo: 'Sem operador ou sem atividade (linha de totais ou em branco).' }); continue; }
    const s = String(op).replace(/\s+/g, ' ').trim();
    const pos = s.indexOf('-');
    if (pos < 0) { r.ignoradas.push({ linha: nLinha, motivo: `Operador "${s}" fora do formato "código - nome".` }); continue; }
    const codigo = s.slice(0, pos).trim(), nome = s.slice(pos + 1).trim();
    if (!codigo) { r.ignoradas.push({ linha: nLinha, motivo: `Operador "${s}" sem código.` }); continue; }
    const funcao = funcaoDoTexto(at);
    if (!funcao) { r.erros.push(`Linha ${nLinha}: função desconhecida "${String(at).trim()}" (esperado: Conferente de recebimento, Separação ou Conferência Expedição).`); continue; }
    const data = m.data !== undefined ? dataDaCelula(l[m.data]) : null;
    let mes = m.mes !== undefined ? mesDoTexto(l[m.mes]) : null;
    if (!mes && data) mes = data.getMonth() + 1;
    if (!mes) { r.erros.push(`Linha ${nLinha}: mês não reconhecido ("${l[m.mes] ?? ''}").`); continue; }
    let diasLista = m.dias !== undefined ? parseDias(l[m.dias]) : [];
    if (!diasLista.length && data) diasLista = [data.getDate()];
    const qd = m.qtdeDias !== undefined ? numeroTexto(l[m.qtdeDias]) : null;
    const num = k => m[k] !== undefined ? (numeroTexto(l[m[k]]) ?? 0) : 0;
    brutos.push({
      linha: nLinha, codigo, nome, funcao, mes, data, diasLista,
      diasFuncao: ok(qd) ? qd : diasLista.length,
      pedidos: num('pedidos'), nfs: num('nfs'), skus: num('skus'), unidades: num('unidades'),
      mediaKaizen: m.media !== undefined ? numeroTexto(l[m.media]) : null,
      pesoBruto: m.peso !== undefined ? numeroTexto(l[m.peso]) : null,
      volumeBruto: m.volume !== undefined ? numeroTexto(l[m.volume]) : null,
      destino: m.destino !== undefined && !vazioOuZero(l[m.destino]) ? String(l[m.destino]).trim() : null,
      divergencias: m.divergencias !== undefined ? numeroTexto(l[m.divergencias]) : null
    });
  }
  const meses = [...new Set(brutos.map(b => b.mes))];
  if (meses.length > 1) r.erros.push(`Mês divergente entre linhas: ${meses.map(x => MESES[x - 1]).join(', ')}. Importe um mês por arquivo.`);
  r.mes = meses.length ? meses.sort((a, b) => brutos.filter(x => x.mes === b).length - brutos.filter(x => x.mes === a).length)[0] : null;
  const anosData = [...new Set(brutos.filter(b => b.data).map(b => b.data.getFullYear()))];
  r.anoSugerido = anosData.length === 1 ? anosData[0] : null;
  /* agrupa por colaborador × função (extração diária ou por destino vira um lançamento mensal com detalhe) */
  const grupos = new Map();
  for (const b of brutos) {
    const k = b.codigo + '|' + b.funcao;
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(b);
  }
  const permiteAgrupar = m.data !== undefined || m.destino !== undefined;
  for (const [k, gs] of grupos) {
    if (gs.length > 1 && !permiteAgrupar) {
      r.erros.push(`${gs[0].codigo} - ${gs[0].nome} aparece ${gs.length} vezes em ${FUNC[gs[0].funcao].nome} (linhas ${gs.map(g => g.linha).join(', ')}). Sem coluna Data ou Destino, cada colaborador deve ter uma linha por função.`);
      continue;
    }
    const dias = new Set(); gs.forEach(g => g.diasLista.forEach(d => dias.add(d)));
    const somaK = key => gs.reduce((s, g) => s + (ok(g[key]) ? g[key] : 0), 0);
    const reg = {
      linhas: gs.map(g => g.linha), codigo: gs[0].codigo, nome: gs[0].nome, funcao: gs[0].funcao, mes: gs[0].mes,
      diasLista: [...dias].sort((a, b) => a - b),
      diasFuncao: gs.length > 1 ? (dias.size || somaK('diasFuncao')) : gs[0].diasFuncao,
      pedidos: somaK('pedidos'), nfs: somaK('nfs'), skus: somaK('skus'), unidades: somaK('unidades'),
      mediaKaizen: gs.length === 1 ? gs[0].mediaKaizen : null,
      pesoBruto: gs.some(g => ok(g.pesoBruto)) ? somaK('pesoBruto') : null,
      volumeBruto: gs.some(g => ok(g.volumeBruto)) ? arred(somaK('volumeBruto'), 4) : null,
      divergencias: gs.some(g => ok(g.divergencias)) ? somaK('divergencias') : null,
      destino: gs.length === 1 ? gs[0].destino : (gs.some(g => g.destino) ? 'vários' : null)
    };
    if (m.data !== undefined) reg.diario = gs.filter(g => g.data).map(g => ({ data: `${g.data.getFullYear()}-${String(g.data.getMonth() + 1).padStart(2, '0')}-${String(g.data.getDate()).padStart(2, '0')}`, pedidos: g.pedidos, nfs: g.nfs, skus: g.skus, unidades: g.unidades, divergencias: g.divergencias, destino: g.destino }));
    if (m.destino !== undefined && gs.length > 1) {
      reg.porDestino = {};
      for (const g of gs) { const d = g.destino || 'sem destino'; const o = reg.porDestino[d] || (reg.porDestino[d] = { pedidos: 0, nfs: 0, skus: 0, unidades: 0 }); o.pedidos += g.pedidos; o.nfs += g.nfs; o.skus += g.skus; o.unidades += g.unidades; }
    }
    r.registros.push(reg);
  }
  return r;
}
/* validações que dependem do ano escolhido e do que já existe no banco */
function validarImportacao(r, ano) {
  const v = { erros: [...r.erros], alertas: [], novos: [], duplicidades: [], fatiados: [], login: [], desligados: [], nomes: [], diasOperacao: 0 };
  if (!r.registros.length && !v.erros.length) v.erros.push('Nenhuma linha válida encontrada no arquivo.');
  if (!Number.isInteger(ano) || ano < 2000 || ano > 2100) v.erros.push('Ano inválido.');
  const mes = r.mes;
  const ym = mes ? ymDe(ano, mes) : null;
  if (ym != null && mesFechado(ym)) v.erros.push(`${rotuloYM(ym)} está fechado. Reabra o mês em Parâmetros e Metas antes de importar.`);
  for (const g of r.registros) {
    if (!ok(g.diasFuncao) || g.diasFuncao <= 0) v.erros.push(`${g.codigo} - ${g.nome} (${FUNC[g.funcao].nome}): dias zerados.`);
    const max = mes ? diasNoMes(ano, mes) : 31;
    const ruins = g.diasLista.filter(d => d < 1 || d > max);
    if (ruins.length) v.erros.push(`${g.codigo} - ${g.nome} (${FUNC[g.funcao].nome}): dias fora do calendário (${ruins.join(', ')}).`);
    if (g.diasLista.length && g.diasLista.length !== g.diasFuncao) v.alertas.push(`${g.codigo} - ${g.nome} (${FUNC[g.funcao].nome}): a lista tem ${g.diasLista.length} dias e "Qtde Dias" é ${g.diasFuncao}.`);
  }
  const codigos = [...new Set(r.registros.map(g => g.codigo))];
  for (const c of codigos) {
    const gs = r.registros.filter(g => g.codigo === c);
    if (!colab(c)) {
      const porF = {}; gs.forEach(g => { porF[g.funcao] = (porF[g.funcao] || 0) + g.diasFuncao; });
      const sug = Object.entries(porF).sort((a, b) => b[1] - a[1])[0][0];
      v.novos.push({ codigo: c, nome: gs[0].nome, funcaoSugerida: sug, porF });
    } else {
      const cad = colab(c);
      if (cad.nome && norm(cad.nome) !== norm(gs[0].nome)) v.nomes.push(`${c}: cadastro "${cad.nome}" × extração "${gs[0].nome}".`);
      if (ym != null && estaDesligado(c, ym)) v.desligados.push(`${c} - ${nomeExib(c)} está marcado como desligado (${fData(cad.dataDesligamento)}) e aparece na extração.`);
    }
    const dias = new Set(); let df = 0;
    gs.forEach(g => { g.diasLista.forEach(d => dias.add(d)); df += g.diasFuncao; });
    if (df > dias.size && dias.size) v.fatiados.push(`${c} - ${gs[0].nome}: ${df} dias-função em ${dias.size} dias de presença.`);
    for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++) {
      const a = gs[i], b = gs[j];
      if (a.diasFuncao === b.diasFuncao && a.pedidos === b.pedidos && a.nfs === b.nfs && a.skus === b.skus && a.unidades === b.unidades && iguais(a.diasLista, b.diasLista)) v.duplicidades.push({ codigo: c, nome: a.nome, funcoes: [a.funcao, b.funcao], texto: `${c} - ${a.nome}: lançamentos idênticos em ${FUNC[a.funcao].nome} e ${FUNC[b.funcao].nome} (${a.diasFuncao} dias, ${fInt(a.skus)} itens, ${fInt(a.unidades)} unidades).` });
    }
  }
  for (const f of FUNCOES) {
    const eleg = r.registros.filter(g => g.funcao === f.id && g.diasFuncao >= P().minimoDias);
    const med = mediana(eleg.map(g => g.skus / g.diasFuncao));

  }
  const dOp = new Set(); r.registros.forEach(g => g.diasLista.forEach(d => dOp.add(d)));

}
function docLancamentoImportado(g, ano, arquivo, agora, suspeitos) {
  const id = idLancamento(ano, g.mes, g.codigo, g.funcao);
  const susp = suspeitos.has(g.codigo + '|' + g.funcao);
  const doc = {
    ano, mes: g.mes, funcao: g.funcao, codigo: g.codigo, nomeKaizen: g.nome,
    diasLista: g.diasLista, diasFuncao: g.diasFuncao, pedidos: g.pedidos, nfs: g.nfs, skus: g.skus, unidades: g.unidades,
    mediaKaizen: ok(g.mediaKaizen) ? g.mediaKaizen : null, pesoBruto: ok(g.pesoBruto) ? g.pesoBruto : null, volumeBruto: ok(g.volumeBruto) ? g.volumeBruto : null,
    divergencias: ok(g.divergencias) ? g.divergencias : null, destino: g.destino || null,

  };

  if (g.porDestino) doc.porDestino = g.porDestino;

}
function diferencaMes(r, ano) {
  const ym = ymDe(ano, r.mes);
  const existentes = new Map(lancamentosPeriodo(ym, ym).map(l => [l.id, l]));
  const campos = ['diasLista', 'diasFuncao', 'pedidos', 'nfs', 'skus', 'unidades'];
  const res = { novos: [], alterados: [], iguais: [], ausentes: [] };
  const vistos = new Set();
  for (const g of r.registros) {
    const id = idLancamento(ano, g.mes, g.codigo, g.funcao);
    vistos.add(id);
    const e = existentes.get(id);
    if (!e) { res.novos.push(g); continue; }
    const mud = campos.filter(k => !iguais(e[k], g[k]));
    if (mud.length) res.alterados.push({ g, e, mud }); else res.iguais.push(g);
  }
  for (const [id, e] of existentes) if (!vistos.has(id)) res.ausentes.push(e);
  return res;
}

const PDF_COR = { bordo: [125, 0, 3], simao: [255, 42, 0], texto: [43, 35, 33], texto2: [110, 99, 96], borda: [232, 226, 223], fundo: [251, 248, 247], tint: [255, 237, 232] };
const PDF_M = 10; // margem em mm
/* fontes padrão do PDF usam a codificação WinAnsi: troca símbolos que ela não tem */
function pdfTexto(s) {
  return String(s ?? '')
    .replace(/−/g, '-').replace(/≈/g, '~').replace(/→/g, '->').replace(/▲/g, '+').replace(/▼/g, '-')
    .replace(/⚠/g, '*').replace(/✓/g, '').replace(/≥/g, '>=').replace(/≤/g, '<=').replace(/›/g, '>')
    .replace(/ | /g, ' ').replace(/[  ​]/g, '').replace(/[^\x09\x0a\x0d\x20-\x7e -ÿ–—‘’“”•…€]/g, '');
}
async function prepararPDF() {
  const okJ = await garantirBiblioteca('jspdf');

  if (!okJ || !okT) throw new Error('Não foi possível carregar o gerador de PDF. Verifique a conexão e tente de novo.');
  if (!window.Chart) await garantirBiblioteca('chart');
}
function novoPDF() {
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
  doc.setFont('helvetica', 'normal');
  doc.setLineHeightFactor(1.3);
  return doc;
}
const PDF_LARG = 210 - 2 * PDF_M;
function pdfCabecalho(doc, titulo, subtitulo) {
  doc.__paginasComCabecalho = doc.__paginasComCabecalho || new Set();
  doc.__paginasComCabecalho.add(doc.getCurrentPageInfo().pageNumber);
  try { doc.addImage(LOGO_CHAPEU, 'PNG', PDF_M, 7, 11, 10.2); } catch (e) { /* sem logo */ }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...PDF_COR.bordo);
  doc.text(pdfTexto(EMPRESA), PDF_M + 14, 11);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...PDF_COR.texto2);
  doc.text('Mapa de Produtividade', PDF_M + 14, 15);
  doc.setFontSize(8);
  doc.text(pdfTexto(`Emitido em ${new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}`), 210 - PDF_M, 11, { align: 'right' });
  doc.setDrawColor(...PDF_COR.borda); doc.setLineWidth(0.3); doc.line(PDF_M, 19, 210 - PDF_M, 19);
  let y = 26;
  if (titulo) { doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(...PDF_COR.bordo); const ls = doc.splitTextToSize(pdfTexto(titulo), PDF_LARG); doc.text(ls, PDF_M, y); y += ls.length * 6.5; }
  if (subtitulo) { doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...PDF_COR.texto2); const ls = doc.splitTextToSize(pdfTexto(subtitulo), PDF_LARG); doc.text(ls, PDF_M, y); y += ls.length * 4.6 + 2; }
  return y + 2;
}
function pdfRodapes(doc, rotulo) {
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...PDF_COR.texto2);
    doc.setDrawColor(...PDF_COR.borda); doc.line(PDF_M, 287, 210 - PDF_M, 287);
    doc.text(pdfTexto(`${rotulo} · Fonte: coletor Kaizen integrado ao Winthor`), PDF_M, 291);
    doc.text(`Página ${i} de ${n}`, 210 - PDF_M, 291, { align: 'right' });
  }
}
function pdfQuebraSePreciso(doc, y, altura) {
  if (y + altura > 282) { doc.addPage(); return pdfCabecalho(doc, '', ''); }
  return y;
}
function pdfTitulo(doc, y, texto) {
  y = pdfQuebraSePreciso(doc, y, 16);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...PDF_COR.bordo);
  doc.text(pdfTexto(texto), PDF_M, y + 4);
  doc.setDrawColor(...PDF_COR.simao); doc.setLineWidth(0.6); doc.line(PDF_M, y + 6, PDF_M + 14, y + 6); doc.setLineWidth(0.3);
  return y + 10;
}
function pdfParagrafos(doc, y, paragrafos, { tamanho = 11, marcadores = false, justificar = true } = {}) {
  doc.setFont('helvetica', 'normal'); doc.setFontSize(tamanho); doc.setTextColor(...PDF_COR.texto);
  const alturaLinha = tamanho * 0.3528 * 1.3;
  for (const p of paragrafos) {
    const recuo = marcadores ? 4 : 0;
    const linhas = doc.splitTextToSize(pdfTexto(p), PDF_LARG - recuo);
    const alt = linhas.length * alturaLinha + 2.2;
    y = pdfQuebraSePreciso(doc, y, Math.min(alt, 60));
    if (marcadores) { doc.setTextColor(...PDF_COR.simao); doc.text('•', PDF_M, y + alturaLinha * 0.75); doc.setTextColor(...PDF_COR.texto); }
    if (justificar && linhas.length > 1) {
      doc.text(pdfTexto(p), PDF_M + recuo, y + alturaLinha * 0.75, { maxWidth: PDF_LARG - recuo, align: 'justify' });
    } else {
      doc.text(linhas, PDF_M + recuo, y + alturaLinha * 0.75);
    }
    y += alt;
  }
  return y + 1;
}
const NOTA_QUEBRA = '* Comparação afetada pela quebra de série do escopo da coleta (entrada das rotas externas no coletor): o aumento de volume não é ganho de produtividade.';
function pdfNota(doc, y, texto) {
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...PDF_COR.texto2);
  const ls = doc.splitTextToSize(pdfTexto(texto), PDF_LARG);
  y = pdfQuebraSePreciso(doc, y, ls.length * 3.4 + 2);
  doc.text(ls, PDF_M, y + 2.5);
  return y + ls.length * 3.4 + 3;
}
function pdfKpis(doc, y, itens) {
  const temQuebra = itens.some(it => /⚠/.test(`${it.variacao || ''} ${it.detalhe || ''}`));
  const body = [];
  for (let i = 0; i < itens.length; i += 2) {
    const a = itens[i], b = itens[i + 1];
    body.push([pdfTexto(a.rotulo), pdfTexto(a.valor), pdfTexto([a.variacao, a.detalhe].filter(Boolean).join(' · ')), b ? pdfTexto(b.rotulo) : '', b ? pdfTexto(b.valor) : '', b ? pdfTexto([b.variacao, b.detalhe].filter(Boolean).join(' · ')) : '']);
  }
  doc.autoTable({
    startY: y, body, theme: 'grid',
    styles: { font: 'helvetica', fontSize: 8.5, cellPadding: 2, textColor: PDF_COR.texto, lineColor: PDF_COR.borda, lineWidth: 0.2, valign: 'middle' },
    columnStyles: { 0: { textColor: PDF_COR.texto2, cellWidth: 33 }, 1: { fontStyle: 'bold', fontSize: 11, cellWidth: 25, halign: 'right' }, 2: { textColor: PDF_COR.texto2, fontSize: 7.5 }, 3: { textColor: PDF_COR.texto2, cellWidth: 33 }, 4: { fontStyle: 'bold', fontSize: 11, cellWidth: 25, halign: 'right' }, 5: { textColor: PDF_COR.texto2, fontSize: 7.5 } },
    didDrawPage: () => {
      const pg = doc.getCurrentPageInfo().pageNumber;
      if (!doc.__paginasComCabecalho || !doc.__paginasComCabecalho.has(pg)) pdfCabecalho(doc, '', '');
    },
    margin: { left: PDF_M, right: PDF_M, top: 24 }
  });
  const y2 = doc.lastAutoTable.finalY + 1.5;
  return temQuebra ? pdfNota(doc, y2, NOTA_QUEBRA) + 4 : y2 + 4.5;
}
/* no PDF (A4 retrato) saem as colunas derivadas marcadas pdf:false; o Excel continua com todas */
function linhasExport(modelo) {
  const cols = modelo.colunas.filter(c => c.exportar !== false && c.pdf !== false && c.rotulo !== '');
  const linhas = [];
  for (const l of modelo.linhas) {
    if (l._grupo) { linhas.push({ grupo: l._grupo }); continue; }
    linhas.push({ cel: cols.map(c => celulaTexto(c, l)) });
  }
  return { cols, linhas };
}
/* larguras mínimas (mm) para as colunas de texto não quebrarem palavra por palavra */
const LARGURA_MIN_PDF = { nome: 30, situacao: 19, f: 22, mov: 9, pos: 8, a: 30, n: 30 };
function alturaTabelaEstimada(modelo, fonte = 7.6) {
  const n = modelo.linhas.length + 1 + (modelo.rodape ? 1 : 0);
  return n * (fonte * 0.3528 * 1.3 + 2.9) + 2;
}
function pdfTabela(doc, y, modelo, { fonte = 7.6 } = {}) {
  const { cols, linhas } = linhasExport(modelo);
  if (!linhas.length) return pdfParagrafos(doc, y, [modelo.vazio || 'Sem registros.'], { tamanho: 9 });
  const temQuebra = linhas.some(l => l.cel && l.cel.some(t => /⚠/.test(t)));
  const numerico = c => ['int', 'd1', 'd2', 'dx', 'pct', 'pct1'].includes(c.tipo);
  const body = linhas.map(l => l.grupo ? [{ content: pdfTexto(l.grupo), colSpan: cols.length, styles: { fillColor: PDF_COR.fundo, textColor: PDF_COR.texto2, fontStyle: 'bold', fontSize: fonte - 0.4 } }] : l.cel.map(pdfTexto));
  const foot = modelo.rodape ? [cols.map(c => { const v = modelo.rodape[c.id]; return v === undefined ? '' : pdfTexto(typeof v === 'number' ? fNum(v, c.tipo) : v); })] : undefined;
  doc.autoTable({
    startY: y, margin: { left: PDF_M, right: PDF_M, top: 24 }, head: [cols.map(c => pdfTexto(c.rotulo))], body, foot, theme: 'grid', showFoot: 'lastPage',
    styles: { font: 'helvetica', fontSize: fonte, cellPadding: 1.4, textColor: PDF_COR.texto, lineColor: PDF_COR.borda, lineWidth: 0.15, overflow: 'linebreak', valign: 'middle' },
    headStyles: { fillColor: PDF_COR.tint, textColor: PDF_COR.bordo, fontStyle: 'bold', fontSize: fonte - 0.4, lineColor: PDF_COR.borda },
    footStyles: { fillColor: PDF_COR.fundo, textColor: PDF_COR.texto, fontStyle: 'bold' },
    columnStyles: Object.fromEntries(cols.map((c, i) => [i, { ...(numerico(c) ? { halign: 'right' } : {}), ...(!numerico(c) && LARGURA_MIN_PDF[c.id] ? { minCellWidth: LARGURA_MIN_PDF[c.id] } : {}) }])),
    didDrawPage: () => {
      const pg = doc.getCurrentPageInfo().pageNumber;
      if (!doc.__paginasComCabecalho || !doc.__paginasComCabecalho.has(pg)) pdfCabecalho(doc, '', '');
    },
    rowPageBreak: 'avoid'
  });
  return temQuebra ? pdfNota(doc, doc.lastAutoTable.finalY + 1.5, NOTA_QUEBRA) + 4 : doc.lastAutoTable.finalY + 6;
}
/* título + tabela sem partir a tabela quando ela cabe inteira numa página nova */
function pdfTabelaComTitulo(doc, y, titulo, modelo, opts = {}) {
  const alt = alturaTabelaEstimada(modelo, opts.fonte) + 12;
  // cabe inteira numa página nova: quebra antes; não cabe nem assim: garante título, cabeçalho e 3 linhas juntos
  if (y + alt > 282 && (alt < 250 || y + 40 > 282)) { doc.addPage(); y = pdfCabecalho(doc, '', ''); }
  y = pdfTitulo(doc, y, titulo);
  return pdfTabela(doc, y, modelo, opts);
}
function pdfSubtitulo(doc, y, texto) {
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...PDF_COR.texto2);
  const ls = doc.splitTextToSize(pdfTexto(texto), PDF_LARG);
  doc.text(ls, PDF_M, y + 1);
  return y + ls.length * 4.4 + 2;
}
function pdfGrafico(doc, y, specFn, { altura = 70, legenda = '' } = {}) {
  const largPx = 1600, altPx = Math.round(largPx * altura / PDF_LARG);
  const img = imagemGrafico(specFn, largPx, altPx);
  if (!img) return pdfParagrafos(doc, y, ['Gráfico indisponível (biblioteca de gráficos não carregada).'], { tamanho: 9 });
  y = pdfQuebraSePreciso(doc, y, altura + (legenda ? 6 : 2));
  doc.addImage(img, 'PNG', PDF_M, y, PDF_LARG, altura);
  y += altura + 1.5;
  if (legenda) { doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...PDF_COR.texto2); const ls = doc.splitTextToSize(pdfTexto(legenda), PDF_LARG); doc.text(ls, PDF_M, y + 2.5); y += 2 + ls.length * 3.3; }
  return y + 3;
}
function pdfSecoes(doc, y, secoes) {
  for (const s of secoes) {
    if (s.tipo === 'kpis') { y = pdfTitulo(doc, y, s.titulo); y = pdfKpis(doc, y, s.itens); }
    else if (s.tipo === 'texto') { y = pdfTitulo(doc, y, s.titulo); y = pdfParagrafos(doc, y, s.paragrafos.filter(Boolean), { marcadores: !!s.marcadores, tamanho: s.tamanho || 10 }); }
    else if (s.tipo === 'tabela') { y = pdfTabelaComTitulo(doc, y, s.titulo, s.modelo, { fonte: s.fonte || 7.6 }); }
    else if (s.tipo === 'grafico') {
      const alt = Math.min(130, Math.max(55, (s.altura || 300) * 0.24));
      y = pdfQuebraSePreciso(doc, y, alt + 16);
      y = pdfTitulo(doc, y, s.titulo);
      y = pdfGrafico(doc, y, s.specFn, { altura: alt, legenda: s.legenda || '' });
    }
  }
  return y;
}
function nomeArquivo(base, ext) {
  return `${base}`.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '') + '.' + ext;
}
async function salvarArquivo(nome, dados) {
  if (!CAP.downloads) { toast('Este visualizador não permite salvar arquivos. Abra o painel pelo claude.ai num navegador e tente de novo.', 'erro', 8000); return false; }
  try {
    const r = await CAP.downloads.save({ filename: nome, data: dados });
    if (r && r.status === 'saved') toast(`Arquivo pronto: ${nome}`, 'ok');
    return true;
  } catch (e) {
    const code = e && e.code;
    if (code === 'declined') { toast('Arquivo não salvo: o salvamento foi cancelado.'); return false; }
    if (code === 'rate_limited') { toast('Já existe um arquivo aguardando confirmação. Conclua ou cancele o anterior e tente de novo.', 'erro', 7000); return false; }
    if (code === 'too_large') { toast('Arquivo grande demais para este visualizador. Exporte um período ou uma tela menor.', 'erro', 8000); return false; }
    if (code === 'bad_request' || code === 'transform_error' || code === 'rejected_extension') { toast(`Não foi possível salvar o arquivo (${code}).`, 'erro', 8000); return false; }
    // unavailable, not_granted, extension_not_enabled e demais: o visualizador não salva arquivos.
    CAP.downloads = null;
    agendarRender();
    toast('Este visualizador não permite salvar arquivos. Os botões de exportação foram ocultados.', 'erro', 8000);
    return false;
  }
}

function resumoExecutivo(ym) {

  const varI = cdA && cdA.skus ? cd.skus / cdA.skus - 1 : null;
  frases.push(`Em ${rotuloYM(ym).toLowerCase()} o CD processou ${fInt(cd.documentos)} documentos, ${fInt(cd.skus)} itens e ${fInt(cd.unidades)} unidades nas três funções, com ${fInt(cd.dias)} dias-função de ${fInt(cd.colaboradores)} colaboradores${varI != null ? ` (itens ${fSinal(varI * 100, 'int')}% sobre ${rotuloYM(ant).toLowerCase()}${afet ? ', comparação afetada pela entrada das rotas externas no coletor' : ''})` : ''}.`);

  const camp = FUNCOES.map(f => { const c = campeao(ym, f.id, leitura); return c ? `${c.nome} em ${f.nome} (${fPct(c.ind.indice)})` : null; }).filter(Boolean);
  if (camp.length) frases.push(`Campeões do mês: ${camp.join('; ')}.`);
  const riscos = [];
  for (const f of FUNCOES) { const c = op.concentracao[f.id]; if (c && c.share > P().limiteConcentracao) riscos.push(`${c.nome} concentrou ${fPct(c.share)} dos itens ${f.verboItens}`); }
  const al = alertasDoMes(ym);

  frases.push(`${riscos.length ? `Risco de dependência: ${riscos.join('; ')}. ` : ''}${al.length ? `Foram gerados ${al.length} alertas automáticos (${altos} de prioridade alta).` : 'Nenhum alerta automático no mês.'}`);
  const capD = soma(FUNCOES, f => op.capacidade[f.id].dias);
  frases.push(`Fluxo: ${op.saldo != null ? (op.saldo >= 0 ? `entraram ${fInt(op.saldo)} unidades a mais do que foram separadas` : `foram separadas ${fInt(-op.saldo)} unidades a mais do que entraram`) : 'saldo indisponível'}; a conferência cobriu ${fPct1(op.coberturaItens)} dos itens separados; capacidade potencial de ${fD1(capD)} dias-função (≈ ${fD1(div(capD, op.diasOperacao))} pessoas-equivalentes) se os elegíveis abaixo de 100% chegassem à meta.`);

    ], FUNCOES.map(f => ({ f })), { rodape: { f: 'Total', d: soma(FUNCOES, f => op.t[f.id].ag.dias), p: op.pessoasEqTotal } }));

   Gerador próprio (SpreadsheetML + ZIP sem compressão), sem dependência.

const XLSXW = (() => {
  const enc = new TextEncoder();
  const TAB = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; TAB[n] = c >>> 0; }
  function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = TAB[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(arquivos) {
    const d = new Date();
    const hora = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
    const data = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const partes = [], central = [];
    let desloc = 0;
    for (const a of arquivos) {
      const nome = enc.encode(a.nome), dados = a.dados, crc = crc32(dados);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, hora, true); lh.setUint16(12, data, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, dados.length, true); lh.setUint32(22, dados.length, true); lh.setUint16(26, nome.length, true); lh.setUint16(28, 0, true);
      partes.push(new Uint8Array(lh.buffer), nome, dados);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, hora, true); ch.setUint16(14, data, true); ch.setUint32(16, crc, true); ch.setUint32(20, dados.length, true); ch.setUint32(24, dados.length, true);
      ch.setUint16(28, nome.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
      ch.setUint32(38, 0, true); ch.setUint32(42, desloc, true);
      central.push(new Uint8Array(ch.buffer), nome);
      desloc += 30 + nome.length + dados.length;
    }
    const tamCentral = central.reduce((s, p) => s + p.length, 0);
    const fim = new DataView(new ArrayBuffer(22));
    fim.setUint32(0, 0x06054b50, true); fim.setUint16(4, 0, true); fim.setUint16(6, 0, true);
    fim.setUint16(8, arquivos.length, true); fim.setUint16(10, arquivos.length, true);
    fim.setUint32(12, tamCentral, true); fim.setUint32(16, desloc, true); fim.setUint16(20, 0, true);
    const todas = [...partes, ...central, new Uint8Array(fim.buffer)];
    const total = todas.reduce((s, p) => s + p.length, 0);
    const out = new Uint8Array(total);
    let o = 0; for (const p of todas) { out.set(p, o); o += p.length; }
    return out;
  }
  const escXml = s => String(s ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const colLetra = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  /* estilos: 0 texto · 1 cabeçalho · 2 int · 3 d1 · 4 d2 · 5 dx · 6 pct · 7 pct1 · 8 título · 9 subtítulo · 10 grupo · 11 total texto · 12-17 total numérico · 18 texto quebrado */

function copiaDeSeguranca() {
  const colecoes = {};
  for (const col of COLECOES) {
    if (col === 'parametros') { colecoes.parametros = S.parametrosDoc ? [{ id: 'geral', dados: docSimplesParaBanco(S.parametrosDoc) }] : []; continue; }
    colecoes[col] = [...S[col].values()].map(d => ({ id: d.id, dados: col === 'lancamentos' ? docLancamentoParaBanco(d) : docSimplesParaBanco(d) }));
  }
  return { sistema: SISTEMA, versao: VERSAO_DADOS, geradoEm: agoraISO(), colecoes };
}
async function baixarCopia() {
  if (!podeEditar()) { toast('A cópia de segurança é exclusiva de quem edita o painel.', 'erro'); return; }
  const c = copiaDeSeguranca();
  const total = Object.values(c.colecoes).reduce((s, l) => s + l.length, 0);
  await salvarArquivo(nomeArquivo(`Copia_Seguranca_Mapa_CD_Simao_${hojeISO()}`, 'json'), JSON.stringify(c, null, 1), 'application/json');
  toast(`${total} documentos na cópia de segurança.`);
}
async function restaurarCopia(arquivo) {
  if (!podeEditar()) return;
  let dados;
  try { dados = JSON.parse(decodificarTexto(await arquivo.arrayBuffer())); } catch (e) { toast('Arquivo inválido: não é um JSON.', 'erro'); return; }
  if (!dados || dados.sistema !== SISTEMA || !dados.colecoes || typeof dados.colecoes !== 'object') { toast('Este arquivo não é uma cópia de segurança do Mapa de Produtividade.', 'erro', 7000); return; }
  const cols = COLECOES.filter(c => Array.isArray(dados.colecoes[c]));
  const resumo = cols.map(c => {
    const atuais = c === 'parametros' ? (S.parametrosDoc ? ['geral'] : []) : [...S[c].keys()];
    const doArq = dados.colecoes[c].map(d => d.id);
    const sai = atuais.filter(id => !doArq.includes(id));
    return { c, arquivo: doArq.length, atuais: atuais.length, sai: sai.length, saiIds: sai };
  });
  abrirModal({
    titulo: 'Restaurar cópia de segurança', largo: true,
    corpo: `<p>Cópia gerada em <b>${esc(fDataHora(dados.geradoEm))}</b>.</p>
      <div class="tabela-wrap"><table class="tbl"><thead><tr><th>Coleção</th><th class="n">No arquivo</th><th class="n">No painel hoje</th><th class="n">Só no painel</th></tr></thead><tbody>${resumo.map(r => `<tr><td>${esc(r.c)}</td><td class="n">${fInt(r.arquivo)}</td><td class="n">${fInt(r.atuais)}</td><td class="n">${fInt(r.sai)}</td></tr>`).join('')}</tbody></table></div>
      <div class="pilha">
        <label class="check"><input type="radio" name="modo-rest" value="substituir" checked> <span><b>Substituir tudo</b>: o painel fica igual à cópia (os documentos "só no painel" são excluídos).</span></label>
        <label class="check"><input type="radio" name="modo-rest" value="mesclar"> <span><b>Mesclar</b>: grava os documentos da cópia e mantém os que só existem no painel.</span></label>
      </div>
      ${campo({ id: 'rest-conf', rotulo: 'Para confirmar, digite RESTAURAR', valor: '', attrsExtra: { autocomplete: 'off' } })}
      <div class="progresso" hidden id="rest-prog"><i></i></div>`,
    botoes: [{ rotulo: 'Cancelar', classe: 'fantasma' }, { rotulo: 'Restaurar', classe: 'perigo cheio', acao: async ctrl => {
      if (lerCampo(ctrl.el, 'rest-conf').trim().toUpperCase() !== 'RESTAURAR') { marcarErro(ctrl.el, 'rest-conf', 'Digite RESTAURAR para confirmar.'); return false; }
      const modo = $('input[name="modo-rest"]:checked', ctrl.el).value;
      const ops = [];
      for (const r of resumo) {
        for (const d of dados.colecoes[r.c]) if (d && d.id && d.dados && typeof d.dados === 'object') ops.push(opGravar(r.c, d.id, d.dados));
        if (modo === 'substituir') for (const id of r.saiIds) if (r.c !== 'historico') ops.push(opExcluir(r.c, id));
      }
      ctrl.ocupado(true);
      const prog = $('#rest-prog', ctrl.el); prog.hidden = false;
      try {
        await executarOperacoes([...ops, opHistorico({ tipo: 'restauracao', colecao: null, resumo: `Cópia de segurança restaurada (${modo}): ${ops.length} gravações, cópia de ${fDataHora(dados.geradoEm)}` })], (f, t) => { $('i', prog).style.width = Math.round(f / t * 100) + '%'; });
        toast('Cópia de segurança restaurada.', 'ok');
        ctrl.ocupado(false);
        return true;
      } catch (e) { ctrl.ocupado(false); toast(e.message, 'erro', 9000); return false; }
    } }]
  });
}

function iniciar() {
  restaurarPreferencias();
  montarCasca();
  ligarEventos();
  iniciarDicas();
  document.addEventListener('input', ev => { if (ev.target && ev.target.id === 'busca-ficha') atualizarSugestoes(ev.target); });
  document.addEventListener('keydown', ev => {
    if (!ev.target || ev.target.id !== 'busca-ficha') return;
    const caixa = document.getElementById('sugestoes-ficha');
    if (!caixa || caixa.hidden) return;
    const itens = $$('button', caixa);
    let i = itens.findIndex(b => b.classList.contains('ativo'));
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      if (itens[i]) itens[i].classList.remove('ativo');
      i = ev.key === 'ArrowDown' ? Math.min(itens.length - 1, i + 1) : Math.max(0, i - 1);
      if (itens[i]) { itens[i].classList.add('ativo'); itens[i].scrollIntoView({ block: 'nearest' }); }
    } else if (ev.key === 'Enter') {
      ev.preventDefault();
      const b = itens[i >= 0 ? i : 0];
      if (b) { UI.buscaFicha = ''; b.click(); }
    } else if (ev.key === 'Escape') { caixa.hidden = true; }
  });
  document.addEventListener('click', ev => {
    const caixa = document.getElementById('sugestoes-ficha');
    if (caixa && !caixa.hidden && !ev.target.closest('.busca')) caixa.hidden = true;
